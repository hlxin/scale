              direction: in
              label: CatalyticTest
              where:
                driving_forces:
                  none_of:
                  - plasma
      - interpretations:
          any_of:
          - performance_stability
        maturity: provisional
        basis:
        - Schweitzer, Gounder and Rioux 2023, doi:10.5281/zenodo.8029159, section 5 (rates reported over time on stream)
        evidence:
          should:
          - name: performance_over_time
            description: the performance over time, a TimeSeries the test HAS_OUTPUT
            path:
            - edge: HAS_OUTPUT
              label: TimeSeries
      - interpretations:
          any_of:
          - material_stability
        maturity: provisional
        basis:
        - Edgington and Seitz 2023, doi:10.1021/acscatal.2c06282 (degradation of the material, such as dissolution,
          measured apart from performance)
        - Van Turnhout et al. 2025, doi:10.1039/D5EY00027K (the catalyst characterized after the experiment)
        evidence:
          should:
          - name: material_after_test
            description: the catalyst characterized during or after the test, a CatalystState the test reaches (REACHED_BY,
              timing during or after) DETERMINED_BY a characterization or an analysis; a constant performance trace
              shows the performance, not the material
            any_of:
            - path:
              - edge: REACHED_BY
                direction: in
                label: CatalystState
                edge_where:
                  timing:
                    any_of:
                    - during
                    - after
              - edge: DETERMINED_BY
                label: Characterization
            - path:
              - edge: REACHED_BY
                direction: in
                label: CatalystState
                edge_where:
                  timing:
                    any_of:
                    - during
                    - after
              - edge: DETERMINED_BY
                label: Analysis
    Characterization:
      when:
      - observation_mode:
          any_of:
          - operando
        maturity: provisional
        basis:
        - Tackett et al., Rigor and Reproducibility in Electrocatalysis, Best Practices for Operando Studies, ACS Catal.
          2026, 16, 13861, doi:10.1021/acscatal.6c01946 (operando measurements are made under working catalytic conditions
          while correlating what is observed with quantitative measures of activity or selectivity; the synchronization
          protocol is reported; the performance in the spectroscopic cell is benchmarked against a conventional cell)
        - Meyer et al., Recommendations to standardize reporting, execution, and interpretation of X-ray Absorption
          Spectroscopy measurements, J. Catal. 2024, 432, 115369, doi:10.1016/j.jcat.2024.115369 (without kinetics
          measured at the beamline that match those of a laboratory reactor, the experiment counts as in situ; for an
          operando experiment, conversion and selectivity are reported)
        evidence:
          should:
          - name: working_test
            description: the catalytic test under whose working conditions it was made (DURING a CatalyticTest; a treatment
              or procedure step is not working catalytic conditions)
            path:
            - edge: DURING
              label: CatalyticTest
          - name: kinetics_while_characterizing
            description: the kinetics measured on the same specimen while it was made (DURING a CatalyticTest with
              specimen same_specimen, timing simultaneous and kinetics measured or matched_to_benchmark); an overlap in
              time alone is not a pairing
            path:
            - edge: DURING
              label: CatalyticTest
              edge_where:
                specimen:
                  any_of:
                  - same_specimen
                timing:
                  any_of:
                  - simultaneous
                kinetics:
                  any_of:
                  - measured
                  - matched_to_benchmark
    Analysis:
      when:
      - analysis_kind:
          any_of:
          - spectral_fit
        maturity: provisional
        basis:
        - Meyer et al. 2024, doi:10.1016/j.jcat.2024.115369 (XAS averages over every environment of the absorbing atoms;
          linear combination fitting depends on the references assumed; the fitted parameters, the variables held fixed
          or constrained and their uncertainties are reported; the best model is contrasted with poorer ones)
        should:
        - method
        - results
        - limitations
        evidence:
          should:
          - name: fitted_data
            description: the data the fit is made to, a Dataset (the measured spectra) or the Characterization that it
              HAS_INPUT
            any_of:
            - path:
              - edge: HAS_INPUT
                label: Dataset
            - path:
              - edge: HAS_INPUT
                label: Characterization
      - analysis_kind:
          any_of:
          - transport_check
        maturity: provisional
        basis:
        - Schweitzer, Gounder and Rioux 2023, doi:10.5281/zenodo.8029159, section 5 (the methods, conditions and results of
          the transport criteria are reported; gradients may appear at some conditions and not at others)
        should:
        - evaluation_basis
        - method
        - verdict
        - temperature
        evidence:
          should:
          - name: assessed_experiment
            description: the experiment whose rates the check assesses (HAS_INPUT)
            path:
            - edge: HAS_INPUT
              label: Experiment
      - analysis_kind:
          any_of:
          - transport_check
        evaluation_basis:
          any_of:
          - numerical
        maturity: provisional
        should:
        - results
      - analysis_kind:
          any_of:
          - transport_check
        evaluation_basis:
          any_of:
          - experimental
        maturity: provisional
        evidence:
          should:
          - name: compared_runs
            description: the runs the check compares, at least two experiments it HAS_INPUT (the test and a run that varies
              particle size, flow rate at constant contact time or stirring)
            min: 2
            path:
            - edge: HAS_INPUT
              label: Experiment
    Computation:
      when:
      - computation_kind:
          any_of:
          - electronic_structure
        maturity: provisional
        basis:
        - Winther et al., Catalysis-Hub.org, an open electronic structure database for surface reactions, Sci. Data 2019, 6,
          75, doi:10.1038/s41597-019-0081-y (each reaction energy is kept with the code, the functional and the
          structures it was computed from)
        should:
        - level_of_theory
        - charge_treatment
        - spin_treatment
        - dispersion
        - settings
        - configuration
