        maturity: provisional
        basis:
        - Allam et al., AQCat25, npj Comput. Mater. 2026, 12, 226, doi:10.1038/s41524-026-02099-6 (models named with their
          checkpoints; the data a model is trained on kept apart from the validation and test data used to evaluate it)
        should:
        - level_of_theory
        edges:
          should:
          - USES_MODEL
        evidence:
          should:
          - name: fitted_on
            description: the data the model was fitted to, an experiment that EVALUATES the model it uses with
              evaluation_kind calibration
            path:
            - edge: USES_MODEL
            - edge: EVALUATES
              direction: in
              edge_where:
                evaluation_kind:
                  any_of:
