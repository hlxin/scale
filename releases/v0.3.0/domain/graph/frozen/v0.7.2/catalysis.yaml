        basis:
        - Melander, Wu, Weckman and Honkala, Constant inner potential DFT for modelling electrochemical systems under
          constant potential and bias, npj Comput. Mater. 2024, 10, 5, doi:10.1038/s41524-023-01184-4 (a single electrode
          potential has several definitions, with different scales and references)
        should:
        - electrode_potential
        - reference_scale
      - computation_kind:
          any_of:
