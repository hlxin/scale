          should:
          - USES_ELECTRODE
          - IN_CELL
      - driving_forces:
          any_of:
          - photo
        must:
        - illumination
        should:
        - irradiance
        - wavelength
        - illuminated_area
        - optical_path
        - apparent_quantum_yield
        - temperature
        edges:
          must:
          - ILLUMINATED_BY
      - driving_forces:
          any_of:
          - plasma
        should:
        - discharge_power
        - specific_energy_input
        - applied_voltage
        - excitation_frequency
        - temperature
        - pressure
        - energy_yield
        edges:
          must:
          - USES_PLASMA
          should:
          - FED_WITH
      - driving_forces:
          all_of:
          - photo
          - thermo
        must:
        - temperature_measured_at
