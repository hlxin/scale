        - cell_voltage
        - ipce
        - excited_species
        values:
          light_absorber:
          - photoelectrode
          - molecular_photocatalyst
          - photosensitizer
      - driving_forces:
          any_of:
          - electrothermo
        maturity: provisional
        basis:
        - Wismann et al. 2021, doi:10.1016/j.cej.2021.131509 (an electrically heated reactor's transients)
        - Schweitzer, Gounder and Rioux 2023, doi:10.5281/zenodo.8029159, section 5 (transients before steady state are
          reported)
        edges:
          should:
          - HAS_OPERATION
      - interpretations:
          any_of:
          - intrinsic_kinetics
        maturity: provisional
        basis:
        - Schweitzer, Gounder and Rioux 2023, doi:10.5281/zenodo.8029159, section 5 (functional tests or criteria
          affirm that gradients of temperature and concentration are absent; their methods, conditions and results
          are reported)
        - Flaherty and Bhan 2024, doi:10.1016/j.jcat.2024.115408
        evidence:
          should:
          - name: transport_assessment
            description: an assessment of heat and mass transport for this test, an Analysis with analysis_kind
              transport_check that HAS_INPUT it
            report: evaluation_basis
            path:
            - edge: HAS_INPUT
