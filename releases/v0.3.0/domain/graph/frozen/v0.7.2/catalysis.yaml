          - name: validated_by
            description: its validation, an experiment that EVALUATES the model it uses with evaluation_kind validation or
              benchmark (one on the data the model was fitted to is reported by the validator, not counted as independent)
            path:
            - edge: USES_MODEL
            - edge: EVALUATES
              direction: in
              edge_where:
                evaluation_kind:
                  any_of:
                  - validation
                  - benchmark
