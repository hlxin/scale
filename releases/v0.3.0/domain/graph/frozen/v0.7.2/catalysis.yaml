        - flow_rate
        - time_on_stream
        - conversion
        - selectivity
        - temperature_measured_at
        edges:
          must:
          - FED_WITH
          should:
          - IN_REACTOR
      - driving_forces:
          all_of:
          - electrothermo
        must:
