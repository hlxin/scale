domain: catalysis
maturity: provisional
title: Catalysis
description: 'Catalysis as a whole: chemical species, materials, samples, reactions and reactors; preparations,
  treatments and procedure steps; characterizations, computations and analyses; mechanisms, elementary
  steps and descriptors; catalysts, active sites, feeds, catalyst samples and catalytic tests; and what
  drives a catalytic test: heat, electrically delivered heat, an applied potential or current, light,
  a plasma, and the terms that exist only where they act together. Built on the science kernel. One checklist
  says what a test must and should report, by the driving forces it lists; the roles a substance plays
  (support, promoter, precursor, poison) are on edges, not labels.'
imports: []
nodes:
  ChemicalSpecies:
    is_a: ObjectOfStudy
    fixed:
      object_kind: thing
    description: A chemical identity. Its role in a catalyst, a preparation or a test (component, promoter,
      precursor, poison, reactant, product) is carried by the edge.
    properties:
      formula:
        type: string
      elemental_composition:
        type: map
        key_pattern: ^[A-Z][a-z]?$
        items:
          type: integer
        description: Element symbol to atom count.
      charge:
        type: integer
      smiles:
        type: string
      inchi:
        type: string
      species_kind:
        type: enum
        values:
        - molecule
        - ion
        - atom
        - element
        - radical
        - other
        - macromolecule
        description: What kind of entity the species is; a macromolecule is a protein (an enzyme), a polymer or
          another molecule of high molar mass, named by its source and identifiers (an enzyme's EC number), not by a
          formula.
      properties:
        type: map
        items:
          type: value
        description: Stated properties of the substance as used.
      isotopic_label:
        type: text
        description: The isotopic label as stated (e.g. "C14 in the methyl group"); a labelled compound
          is a species of its own, not the unlabelled one.
  ProductLump:
    is_a: ObjectOfStudy
    maturity: provisional
    fixed:
      object_kind: thing
    description: A class of products that a source reports together, defined by a carbon-number
      window (C1, C2-C4, C5+, C5-C11, C21+), often a compound class (olefins, paraffins, alcohols) and
      sometimes a boiling range or collection phase. It is not a chemical identity (that is a ChemicalSpecies)
      and has no formula. It is the target of a selectivity, yield or rate counted on the lump. Whether one
      lump lies inside another is stated by SUBSET_OF, never inferred from the ranges. A document may mint its
      own lumps; a shared id for a common lump (C5+) is a convention of a corpus, not part of the schema.
    properties:
      carbon_min:
        type: integer
        description: The least carbon number in the lump (5 for C5-C11 and C5+).
      carbon_max:
        type: integer
        description: The greatest carbon number in the lump (11 for C5-C11). Absent for an open end (C5+);
          then set open_ended.
      open_ended:
        type: boolean
        description: true = the lump has no upper carbon number (C5+, C21+); false = carbon_max is its upper end.
      compound_class:
        type: enum
        values:
        - hydrocarbon
        - paraffin
        - isoparaffin
        - olefin
        - alpha_olefin
        - aromatic
        - oxygenate
        - alcohol
        - aldehyde
        - other
        - not_reported
        description: The class of compounds within the carbon window, as the source names it; other with
          the source's words in definition.
      boiling_range:
        type: text
        description: The boiling range or fraction name as stated (e.g. "gasoline", "diesel", "jet").
      phase:
        type: enum
        values:
        - gas
        - liquid
        - solid
        - aqueous
        - organic
        - not_reported
        description: The phase in which the lump was collected, when the source says.
      definition:
        type: text
        description: The lump as the source defines it, in its words.
  Material:
    is_a: ObjectOfStudy
    fixed:
      object_kind: thing
    description: |-
      A material identity: a solid's composition with its crystal structure or stated non-crystalline
      form (wurtzite ZnO, gamma-Al2O3, ZnCr2O4 spinel, fcc Cu, amorphous silica, MFI zeolite). The
      counterpart of ChemicalSpecies for solids: Al2O3 is one ChemicalSpecies but several Materials.
      Domains declare the roles a material plays (in catalysis, a catalyst or a support);
      the Material is what such a role node is made of. A support, binder or other solid a catalyst is made with is a Material; its role in the catalyst is on HAS_COMPONENT.
    properties:
      formula:
        type: string
      polymorph:
        type: text
        description: The polymorph as the source names it (alpha, gamma, anatase, rutile, wurtzite).
      structure_type:
        type: text
        description: Structure type (spinel, fcc, corundum, perovskite).
      space_group:
        type: string
      crystallinity:
        type: enum
        values:
        - crystalline
        - amorphous
        - not_reported
      framework_code:
        type: string
        description: IZA framework type code of a zeolite (e.g. MFI, FAU).
      material_family:
        type: enum
        values:
        - metal
        - alloy
        - oxide
        - mixed_oxide
        - sulfide
        - carbide
        - nitride
        - zeolite
        - carbon
        - clay
        - molecular_complex
        - organic
        - other
        - not_reported
      nominal_formula:
        type: string
      properties:
        type: map
        items:
          type: value
        description: Stated properties of the material as used (surface area, particle size, pretreatment).
  Sample:
    is_a: ObjectOfStudy
    fixed:
      object_kind: thing
      generality: particular
    description: 'A physical specimen of a chemical, material or catalyst: the batch, or part of a batch,
      that was prepared, treated and examined. Its state at a given time is on the edge that uses it.
      Batch identity is asserted only when the source states it.'
    required:
    - sample_kind
    properties:
      sample_kind:
        type: enum
        values:
        - batch
        - powder
        - pellet
        - granules
        - film
        - electrode
        - reactor_charge
        - other
      batch_identifier:
        type: string
      preparation_status:
        type: enum
        values:
        - prepared
        - purchased
        - proposed
        - not_reported
  Reaction:
    is_a: ObjectOfStudy
    fixed:
      object_kind: phenomenon
    description: A net chemical transformation (a phenomenon of a kind). Participants are HAS_PARTICIPANT
      edges.
    properties:
      equation:
        type: string
      balance_status:
        type: enum
        values:
        - balanced
        - not_checked
        - not_reported
        description: Whether the reaction is balanced, as the source or the curator states it. The validator's own atom
          and charge assessment of the recorded participants is reported apart and never written here.
      direction:
        type: enum
        values:
        - forward
        - reverse
        - reversible
        - not_reported
  Reactor:
    is_a: Instrument
    fixed:
      instrument_kind: reactor
    description: A reactor or apparatus.
    required:
    - reactor_kind
    properties:
      reactor_kind:
        type: enum
        values:
        - batch
        - fixed_bed
        - flow
        - fluidized_bed
        - stirred_tank
        - circulating
        - other
        - not_reported
      volume:
        type: value
      specifications:
        type: map
        items:
          type: value
        description: Dimensions, charge volume or mass, rated pressure and similar.
      design_status:
        type: enum
        values:
        - built
        - planned
        - proposed
        - not_reported
        description: built = operated as described; planned = part of a design the source works out; proposed
          = suggested without a design. A planned plant's operating conditions are a CatalyticTest with
          experiment_status planned.
  Preparation:
    is_a: Procedure
    description: How a sample was made, with its conditions.
    properties:
      steps:
        type: list
        items:
          type: text
        description: The steps as the source words them; structured steps are ProcedureStep nodes linked PART_OF the preparation, with order.
      temperature:
        type: value
        quantity: temperature
      pressure:
        type: value
        quantity: pressure
      duration:
        type: value
      atmosphere:
        type: text
  Treatment:
    is_a: Procedure
    description: A change applied to a sample (drying, calcination, reduction, activation, poisoning,
      regeneration).
    required:
    - treatment_kind
    properties:
      treatment_kind:
        type: enum
        values:
        - drying
        - calcination
        - reduction
        - activation
        - oxidation
        - aging
        - poisoning
        - regeneration
        - other
        - purification
        - exposure
      temperature:
        type: value
        quantity: temperature
      pressure:
        type: value
        quantity: pressure
      duration:
        type: value
      atmosphere:
        type: text
  ProcedureStep:
    is_a: Procedure
    description: One step of a preparation, treatment, protocol or characterization (dissolve, precipitate,
      age, filter, wash, dry, calcine, reduce, impregnate), with its conditions.
    required:
    - action
    properties:
      action:
        type: enum
        values:
        - add
        - dissolve
        - mix
        - precipitate
        - age
        - filter
        - wash
        - dry
        - calcine
        - reduce
        - oxidize
        - impregnate
        - grind
        - pelletize
        - sieve
        - heat
        - cool
        - stir
        - transfer
        - activate
        - other
      temperature:
        type: value
        quantity: temperature
      pressure:
        type: value
        quantity: pressure
      duration:
        type: value
      ramp_rate:
        type: value
      atmosphere:
        type: text
  Characterization:
    is_a: Experiment
    fixed:
      experiment_kind: physical
    description: |
      A characterization measurement of a sample: X-ray diffraction, BET surface area, pore
      analysis, chemisorption, XPS, TPR, microscopy and similar. The sample is linked by
      CHARACTERIZES, with the state it was measured in; results are value objects.
    required:
    - technique
    properties:
      technique:
        type: text
        description: The technique as the source names it (e.g. "X-ray diffraction", "BET"); "not stated"
          when the source does not name it.
      technique_id:
        type: string
        description: An identifier for the technique when known, e.g. a CHMO term.
      temperature:
        type: value
        quantity: temperature
      pressure:
        type: value
        quantity: pressure
      atmosphere:
        type: text
      observation_mode:
        type: enum
        values:
        - operando
        - in_situ
        - quasi_in_situ
        - ex_situ
        - not_reported
        description: The mode as the source reports it. operando = characterized while the kinetics (activity or
          selectivity) are measured, under reaction conditions; in_situ = in a controlled environment; quasi_in_situ =
          after the action without exposure to air; ex_situ = after transfer through air or other environments. The mode
          is the source's label, kept as reported; whether an observation the source calls operando was made while the
          kinetics were measured (on the same specimen, at the same time) is evaluated from its DURING link (the
          checklist's operando case), never read from the label.
        maturity: provisional
      information_depth:
        type: enum
        values:
        - surface
        - near_surface
        - bulk
        - projection
        - not_reported
        description: What part of the material the signal comes from (XPS surface, XRD bulk, TEM a projection
          through the particle).
        maturity: provisional
      sampling:
        type: enum
        values:
        - single_particle
        - local_region
        - ensemble
        - not_reported
        description: Whether the measurement follows single particles, a local region or averages over the sample. An
          ensemble signal (XAS, XRD, IR of a powder) averages over everything it samples, so whether it tells coexisting
          phases apart from one mixed phase, or sees a minority species at all, depends on the technique, the data, the
          reference spectra and the analysis model; a fit, with its alternatives and limitations, is an Analysis
          (analysis_kind spectral_fit).
        maturity: provisional
      transfer:
        type: text
        description: How the sample got from the action to the measurement (cooled in the gas and evacuated;
          transferred in air for 5 min).
        maturity: provisional
  Computation:
    is_a: Experiment
    fixed:
      experiment_kind: computational
    description: |
      A calculation (DFT, a machine-learned model's predictions, a microkinetic model, an equilibrium screen) with its
      model, software and structure models, the conditions it assumes and its results. What it predicts is linked by
      PREDICTS. The method its energies come from is stated in fields a comparison reads (level_of_theory,
      charge_treatment) and shows (dispersion, hubbard_u, spin_treatment, solvation, its temperature, pressure and
      electrode potential); the input files, the environment and the structures stay in versioned, checksummed Datasets
      (configuration, execution_environment, a model's stored_in).
    properties:
      task:
        type: text
      method:
        type: text
        description: The method as the source names it, in its words (kept as reported); the fields below state what a
          comparison reads.
      temperature:
        type: value
        quantity: temperature
      pressure:
        type: value
        quantity: pressure
      computation_kind:
        type: enum
        maturity: provisional
        values:
        - electronic_structure
        - machine_learned
        - force_field
        - microkinetic
        - kinetic_monte_carlo
        - thermodynamic
        - other
        - not_reported
        description: What kind of calculation it is. electronic_structure = DFT or another quantum-chemical method;
          machine_learned = predictions by a trained model (its Model, with its version and the data it was fitted to);
          force_field = classical interatomic potentials; microkinetic = a mean-field kinetic model of elementary steps;
          thermodynamic = an equilibrium or phase calculation (ab initio thermodynamics included).
      level_of_theory:
        type: value
        maturity: provisional
        description: The electronic-structure method its energies come from, as a short name the source gives, in a text
          value. For DFT it is the exchange-correlation functional (RPBE, PBE, BEEF-vdW, HSE06); another method goes by its
          name (CCSD(T)), and a machine-learned model by its name and checkpoint. A comparison of computed energies reads
          it, and energies of two methods are never compared; not_reported when the source does not say.
      dispersion:
        type: value
        maturity: provisional
        description: The dispersion (van der Waals) correction as the source names it, in a text value (D3, D3(BJ), TS,
          vdW-DF2), or "none" when the source says none was used; a functional that includes it (BEEF-vdW) says so here
          too.
      hubbard_u:
        type: map
        maturity: provisional
        key_pattern: ^[A-Z][a-z]?$
        items:
          type: value
        description: The Hubbard U (or U − J) applied to each element, as stated (Co 3.3 eV); recorded only when the
          source applies one.
      spin_treatment:
        type: enum
        maturity: provisional
        values:
        - spin_polarized
        - non_spin_polarized
        - other
        - not_reported
        description: Whether the calculation lets the spins polarize (and so finds magnetic states); the initial
          magnetic moments or the spin multiplicity go in settings.
      solvation:
        type: enum
        maturity: provisional
        values:
        - none
        - implicit
        - explicit
        - implicit_and_explicit
        - not_reported
        description: How a solvent is represented (an implicit continuum, explicit molecules, both, or none); the model
          (VASPsol, a number of water layers) goes in settings.
      charge_treatment:
        type: enum
        maturity: provisional
        values:
        - constant_charge
        - constant_potential
        - other
        - not_reported
        description: Whether the number of electrons is held fixed (constant_charge, an ordinary calculation of a neutral
          or charged cell, a computational hydrogen electrode included) or the electrode potential is held while the
          electrons vary (constant_potential, a grand-canonical calculation, which states its electrode_potential and its
          reference_scale). Energies of the two are never compared unless the source converts one into the other.
      settings:
        type: map
        maturity: provisional
        items:
          type: value
        description: 'The numerical settings that set its precision and model, by key, as stated: cutoff_energy, kpoints
          (a text value, "4×4×1"), smearing, scf_convergence, force_convergence, pseudopotentials, basis_set,
          dipole_correction, transition_state_method, initial_magnetic_moments, solvation_model, thermochemistry (how free
          energies were obtained: harmonic, ideal gas), potential_method. The full input stays in the configuration
          Dataset.'
  Analysis:
    is_a: Experiment
    fixed:
      experiment_kind: computational
    description: |
      A calculation or fit reported by a source or made on reported data: an equilibrium constant, a
      kinetic fit (apparent activation energy, reaction orders), a transport-limitation check
      (Weisz-Prater, Mears), with the conditions it applies to and its results.
    properties:
      analysis_kind:
        type: enum
        values:
        - thermodynamic
        - equilibrium
        - kinetic_fit
        - transport_check
        - statistical
        - other
        - balance
        - spectral_fit
        description: balance = a carbon, charge or mass balance of an experiment's results (provisional), over the assays
          it HAS_INPUT (the streams and phases they measured) and its interval; its result is a balance value in the
          experiment's result_values, produced_by the analysis. transport_check = whether heat and mass transport
          affect the rates of the experiment it HAS_INPUT, at the temperature and conditions it states (its
          evaluation_basis says how it was checked). spectral_fit = a fit of measured spectra or patterns (linear
          combination fitting, EXAFS shell fitting, principal component analysis; provisional). The data it fits (a
          Dataset, or the Characterization) and the references it uses are what it HAS_INPUT, its fitted parameters
          (shares of references, coordination numbers, distances) are its results, origin fitted, with their
          uncertainties, and what it cannot tell apart is its limitations. An alternative model of the same data is an
          analysis of its own. A fitted parameter is neither the spectrum nor the site assignment a Claim draws from
          it.
      evaluation_basis:
        type: enum
        maturity: provisional
        values:
        - asserted
        - numerical
        - experimental
        - not_reported
        description: How the analysis reaches its verdict. asserted = the source states it without the calculation or
          test behind it; numerical = a criterion computed from reported data (Weisz-Prater, Mears, Carberry), its
          values in results; experimental = runs that vary what the verdict is about (particle size, flow rate at
          constant contact time, stirring or mixing, active-site dilution), each an experiment the analysis
          HAS_INPUT. The basis is recorded, never judged; no value of a criterion is a threshold of the schema.
      method:
        type: text
      verdict:
        type: text
        description: The conclusion of a check, e.g. "no internal diffusion limitation".
      limitations:
        type: text
        maturity: provisional
        description: What the analysis cannot tell apart or rests on, as the source states it (references that fit
          equally well, a species too dilute to fit, parameters held fixed, a fit range), so that a claim drawn from it
          carries them.
      temperature:
        type: value
        quantity: temperature
      pressure:
        type: value
        quantity: pressure
  StructureModel:
    is_a: Model
    description: 'An atomistic model used in a computation (periodic slab, cluster, bulk cell, molecule); not the
      physical specimen. Its coordinates stay in a Dataset (stored_in, with its version and sha256); the record keeps what
      a query compares: its representation (which also says how it repeats: a periodic slab or bulk cell, or an isolated
      cluster or molecule), composition and facet, and in parameters the supercell (a text value, "p(3×3)"), layers,
      fixed_layers, vacuum, lattice_constant (with its origin: computed or taken from experiment), boundary_conditions and
      relaxation (text values) as stated. What adsorbs on it, and how much, is the computed CatalystState that is a state
      of it (HAS_COMPONENT role adsorbate, with coverage and bound_to); which specimen or state it stands for is REPRESENTS,
      with what that assumes.'
    properties:
      representation:
        type: enum
        values:
        - periodic_slab
        - bulk
        - cluster
        - molecule
        - other
      composition:
        type: string
      facet:
        type: string
      structure_ref:
        type: string
        description: Location or identifier of the structure file (repository record, file path with digest).
  TimeSeries:
    is_a: Dataset
    fixed:
      data_kind: time_series
    description: A series of values over time (operando spectra, reactor temperature, a sensor stream).
      Values stay in external storage; the node says what was recorded and where it is kept.
    required:
    - variable
    properties:
      variable:
        type: text
      unit:
        type: string
      series_kind:
        type: enum
        values:
        - instantaneous
        - average
        - cumulative
        - other
      sampling_interval:
        type: value
      started_at:
        type: datetime
      finished_at:
        type: datetime
  Catalyst:
    is_a: ObjectOfStudy
    fixed:
      object_kind: thing
    description: 'A catalyst formulation as its source names it ("Cu/ZnO/Al2O3 44:36:20 wt", "zinc chromite").
      Its make-up is HAS_COMPONENT edges to species and materials, each with its role (active phase, support,
      promoter, binder, dopant) and fraction; its phases are HAS_PHASE; physical specimens are CatalystSamples
      (HAS_FORMULATION). There are no role labels: a support is a Material, a promoter a ChemicalSpecies,
      and the role is on the edge. An enzyme catalyst (catalyst_family enzyme) has the enzyme, a macromolecule, as
      its active component, and its support when immobilized; a molecular complex has its ligands (role ligand).'
    properties:
      catalyst_family:
        type: enum
        values:
        - metal
        - alloy
        - oxide
        - mixed_oxide
        - sulfide
        - carbide
        - nitride
        - zeolite
        - carbon
        - molecular_complex
        - organic
        - other
        - not_reported
        - enzyme
        - whole_cell
      nominal_formula:
        type: string
      properties:
        type: map
        items:
          type: value
        description: Stated properties other than composition (component ratios, masses, loadings).
      integration_mode:
        type: enum
        maturity: provisional
        values:
        - granule_mixture
        - powder_mixture
        - dual_bed
        - core_shell
        - supported_on
        - other
        - not_reported
        description: 'How the functional components of a multifunctional (bifunctional, tandem) catalyst are
          put together, as the source states it: granule_mixture (granules of each component mixed in one
          bed), powder_mixture (powders ground or mixed before pelletizing), dual_bed (separate beds in
          series; each bed is also a USES_CATALYST with bed_position), core_shell (one component as a shell
          on the other), supported_on (one component dispersed on the other). Say what "other" is in
          integration_scale.note or the evidence. The ratio of the components is HAS_COMPONENT.fraction.'
      integration_scale:
        type: value
        maturity: provisional
        description: The length scale at which the components are integrated, as stated (granule diameter,
          mixing or grinding scale, shell thickness), in the reported unit; the definition or basis says
          which length it is. Text_value carries a stated level (nanoscale, millimetre-scale) when no number
          is given.
      site_proximity:
        type: value
        maturity: provisional
        description: 'How close the sites of the different functions are, as stated. A distance (nm, um, mm)
          in value and unit, or an ordinal level in text_value ("close", "intimate", "remote"). Basis says how
          it was obtained (measured by microscopy, estimated from the integration scale, the authors''
          ranking) and definition names the two kinds of site it is between. Not an inferred value: an
          author''s ranking stays the author''s.'
  ActiveSite:
    is_a: ObjectOfStudy
    fixed:
      object_kind: thing
    description: |
      A site or site ensemble held responsible for catalysis (metal step, oxide vacancy, metal-oxide
      interface, acid site, single atom). Its identity is usually an interpretation: HAS_SITE carries
      the epistemic status, and the population in a given state (a share, a density, a count) is on the
      HAS_SITE from that CatalystState. Whether it is active, a spectator or a precursor for a reaction is
      a Claim about it.
    properties:
      site_kind:
        type: enum
        values:
        - metal_site
        - oxide_site
        - interface_site
        - vacancy
        - defect
        - step_edge
        - acid_site
        - base_site
        - single_atom
        - other
        - not_reported
      proposed_composition:
        type: text
      properties:
        type: map
        items:
          type: value
        description: Site density, coordination and similar stated values. A share, density or count of the site in a
          stated catalyst state goes on the HAS_SITE from that state.
  Feed:
    is_a: ObjectOfStudy
    fixed:
      object_kind: system
    description: A reactant mixture fed to catalytic tests. Components are HAS_COMPONENT edges to species.
    properties:
      ratios:
        type: map
        items:
          type: value
        description: Stated ratios, e.g. h2_co_ratio.
  CatalystSample:
    is_a: Sample
    description: |
      A physical specimen of a catalyst: the batch, or part of a batch, that was prepared, treated,
      tested and characterized. It carries the preparation and treatment history; its state at a
      given time is on the edge that uses it. Batch identity is asserted only when the source states it.
  CatalyticTest:
    is_a: Experiment
    description: 'One reported catalytic test: a catalyst sample (USES_CATALYST), a feed (FED_WITH), a
      reactor (IN_REACTOR) and a reaction (OF_REACTION), driven by one or more driving forces, with the
      conditions and results the source gives. Declared conditions and results are properties; others
      go in the inherited conditions and results maps, and a result identified by its product, assay, phase or
      interval goes in result_values (kernel). Driving-force properties (potential, irradiance,
      discharge power) come from the vocabulary of their driving force. A reported equilibrium estimate
      is a CatalyticTest with test_kind equilibrium_estimate and experiment_kind computational.'
    required:
    - test_kind
    properties:
      test_kind:
        type: enum
        values:
        - activity
        - kinetics
        - stability
        - equilibrium_estimate
        - control
        - screening
        - other
        - equilibrium_measurement
      test_label:
        type: string
        description: The source's own run, experiment or example number.
      driving_forces:
        type: list
        items:
          type: enum
          values:
          - thermo
          - electrothermo
          - electro
          - photo
          - plasma
          - other
        description: 'The driving force or forces of the test. The domain''s checklist applies its items
          by them: thermo and electrothermo the thermal items, electrothermo also the electrical heating,
          electro, photo and plasma their own, and photo with thermo or electro with photo the items where
          those forces meet. A test that lists none has unknown applicability: its driving-force items are neither
          checked nor met, and its checklist is never complete. Whether the test is operated statically or
          dynamically is its Operation (kernel), not a driving force.'
      catalysis_mode:
        type: enum
        maturity: provisional
        values:
        - heterogeneous
        - homogeneous
        - biocatalytic
        - other
        - not_reported
        description: How the source describes the catalysis of the test, as it states it, never inferred from the
          catalyst - heterogeneous (at an interface between phases, a solid catalyst with fluid reactants),
          homogeneous (the catalyst in the same phase as the reactants, a dissolved complex) or biocatalytic (an enzyme
          or whole cells). An immobilized complex or enzyme is what the source calls it.
      interpretations:
        type: list
        maturity: provisional
        items:
          type: enum
          values:
          - system_performance
          - intrinsic_kinetics
          - photothermal_effect
          - nonthermal_light_effect
          - plasma_catalyst_synergy
          - performance_stability
          - material_stability
        description: 'What the source reads the test as showing, so that the checklist asks for the evidence that
          reading needs and no other. system_performance = the performance of the system as tested (reactor,
          conditions), not a property of the catalyst alone; intrinsic_kinetics = rates, orders, activation energies
          or turnover rates of the catalyst itself, free of heat and mass transport effects; photothermal_effect =
          light acts by heating the catalyst; nonthermal_light_effect = light acts beyond heating it;
          plasma_catalyst_synergy = plasma and catalyst together give more than each alone; performance_stability
          = the performance stays constant over the test; material_stability = the catalyst material stays
          unchanged. Record what the source claims, never a reading of your own; a claim without its evidence is
          reported, not removed.'
      temperature:
        type: value
        quantity: temperature
      pressure:
        type: value
        quantity: pressure
      duration:
        type: value
      time_on_stream:
        type: value
      space_velocity:
        type: value
        quantity: space_velocity
      flow_rate:
        type: value
        quantity: flow_rate
      feed_ratio:
        type: value
        description: The stated feed ratio; its note or basis says which (H2/CO, H2/COx).
      conversion:
        type: value
        quantity: conversion
      yield:
        type: value
        quantity: product_yield
      selectivity:
        type: value
        quantity: selectivity
      space_time_yield:
        type: value
      production_rate:
        type: value
      lifetime:
        type: value
        description: Catalyst lifetime or time to a stated activity loss, as reported.
      deactivation_rate:
        type: value
      approach_to_equilibrium:
        type: value
        description: How close the outlet is to equilibrium, as the source defines it (e.g. the methanol
          concentration reached divided by the equilibrium concentration at the same conditions); the
          definition goes in the value's basis.
  Mechanism:
    description: A reaction mechanism or kinetic model file (Cantera, CHEMKIN, RMG, CatMAP), as a set
      of elementary steps for a reaction.
    properties:
      mechanism_format:
        type: enum
        values:
        - cantera_yaml
        - chemkin
        - rmg
        - catmap
        - other
        - not_applicable
      site_density:
        type: value
      mechanism_status:
        type: enum
        values:
        - proposed
        - supported
        - disputed
        - refuted
        - not_evaluated
      uri:
        type: string
      sha256:
        type: string
  ElementaryStep:
    description: An elementary step of a mechanism (adsorption, desorption, surface reaction), with its
      energetics and rate parameters as reported or computed.
    properties:
      equation:
        type: string
      step_kind:
        type: enum
        values:
        - adsorption
        - desorption
        - surface_reaction
        - eley_rideal
        - diffusion
        - gas_phase
        - other
      reversible:
        type: boolean
      rate_form:
        type: enum
        values:
        - arrhenius
        - sticking
        - coverage_dependent
        - bep
        - scaling
        - other
      pre_exponential_factor:
        type: value
      temperature_exponent:
        type: value
      activation_energy:
        type: value
        quantity: activation_energy
        description: The step's activation energy, a computed barrier (its transition state above its initial state) or
          the Ea of its rate constant, as its definition says, with its origin and produced_by (the computation or the
          fit); never an apparent activation energy of an overall rate.
      reaction_energy:
        type: value
        quantity: reaction_energy
        description: The step's electronic energy change, products minus reactants, with its origin and produced_by.
      activation_free_energy:
        type: value
        quantity: activation_free_energy
        maturity: provisional
        description: The free energy of the step's transition state above its initial state, at the temperature and
          potential of the computation that produced it.
      reaction_free_energy:
        type: value
        quantity: reaction_free_energy
        maturity: provisional
        description: The step's free energy change at the temperature, pressures and potential of the computation that
          produced it.
      sticking_coefficient:
        type: value
      coverage_dependence:
        type: text
      parameters:
        type: map
        items:
          type: value
  Descriptor:
    description: A quantity used to predict or map activity (an adsorption energy, a d-band centre, a
      coordination number), with its definition and reference state.
    properties:
      quantity_kind:
        type: string
      definition:
        type: text
      reference_state:
        type: text
  ProcessUnit:
    is_a: Instrument
    fixed:
      instrument_kind: process_unit
    description: 'A unit of a process other than the catalytic reactor under test: a purification or guard
      bed, a scrubber or absorber, a heat exchanger, a separator or condenser, a compressor or circulator,
      a reformer. Units in series are linked by FEEDS_INTO; a test that uses one is linked by USES_INSTRUMENT;
      what a guard bed holds is HAS_COMPONENT.'
    required:
    - unit_kind
    properties:
      unit_kind:
        type: enum
        values:
        - purification
        - guard_bed
        - scrubber
        - absorber
        - heat_exchanger
        - preheater
        - separator
        - condenser
        - compressor
        - circulator
        - reformer
        - shift_converter
        - other
      design_status:
        type: enum
        values:
        - built
        - planned
        - proposed
        - not_reported
        description: built = operated as described; planned = part of a design the source works out; proposed
          = suggested without a design.
      specifications:
        type: map
        items:
          type: value
        description: Dimensions, capacity, duty, operating conditions of the unit.
  CatalystState:
    is_a: ObjectOfStudy
    fixed:
      object_kind: system
    description: |-
      The structure and composition a catalyst sample (or a model of it) is in at a stated point of
      an action sequence: after a pretreatment, during a reaction at a stated pressure or potential,
      after a gas switch. It is the answer to "which phase is in effect": its phases are HAS_PHASE
      edges to Materials (with location and dominance), what it is a state of is STATE_OF, the action
      it is reached by is REACHED_BY (with the timing), and the characterizations or computations that
      establish it are DETERMINED_BY. A test measured in the state is IN_STATE. Its sites and their
      populations are HAS_SITE edges from it, which hold for this state only. A state predicted by a
      simulation has origin computed and is STATE_OF the model, with no specimen of its own. The state
      is a record of what the source reports, not an equilibrium assignment.
    properties:
      state_kind:
        type: enum
        values:
        - as_prepared
        - pretreated
        - working
        - post_reaction
        - transient
        - other
        - not_reported
        description: working = under reaction conditions; post_reaction = after the action, outside it
          (e.g. cooled, transferred).
      regime:
        type: enum
        values:
        - steady
        - transient
        - drifting
        - oscillatory
        - not_reported
        description: drifting = still changing when observed (e.g. an oxide dissolving over hours); oscillatory
          = repeatedly switching or fluctuating.
      dynamics:
        type: list
        items:
          type: enum
          values:
          - static
          - fluctuating
          - reconstructing
          - migrating
          - sintering
          - dissolving
          - redepositing
          - other
        description: What the catalyst is observed doing in this state.
      persistence:
        type: enum
        values:
        - stable
        - metastable
        - kinetically_trapped
        - not_assessed
        description: kinetically_trapped = persists although another state is expected to be stable (e.g.
          an oxide kept alongside metal for hours).
      morphology:
        type: text
        description: The structure in words, as the source gives it ("MoCx overlayers on β-Mo2N").
      conditions:
        type: map
        items:
          type: value
        description: The environment the state is observed in (temperature, total or partial pressures,
          potential).
      properties:
        type: map
        items:
          type: value
        description: Stated values of the state (phase fractions, surface atomic ratios, onset temperatures).
    maturity: provisional
  StateTransition:
    is_a: ObjectOfStudy
    fixed:
      object_kind: phenomenon
    description: |-
      A change of a catalyst from one state (or phase) to another: an oxidation, a reduction, a
      carburization, an encapsulation or its reversal, a dissolution and redeposition, a
      reconstruction. FROM_STATE and TO_STATE name what it starts from and leads to; TRIGGERED_BY names
      the action that sets it off (a gas switch, a pressure step, a potential hold); what promotes or
      suppresses it is DRIVES_TRANSITION.
    required:
    - transition_kind
    properties:
      transition_kind:
        type: enum
        values:
        - oxidation
        - reduction
        - carburization
        - nitridation
        - sulfidation
        - hydroxylation
        - encapsulation
        - decapsulation
        - redispersion
        - sintering
        - dissolution
        - redeposition
        - reconstruction
        - segregation
        - fragmentation
        - other
        - not_reported
      reversibility:
        type: enum
        values:
        - reversible
        - irreversible
        - not_reported
      duration:
        type: value
        description: How long the change takes, as stated.
      mechanism:
        type: text
        description: How the change proceeds, as the source states it.
    maturity: provisional
  Heater:
    is_a: Instrument
    fixed:
      instrument_kind: heater
    description: 'What supplies heat to the reactor or catalyst: a furnace, a bath, a heating block or
      jacket, a fired or electric heater. The Experiment property heating_mode summarizes it when no heater
      record exists.'
    properties:
      heater_kind:
        type: enum
        values:
        - tube_furnace
        - fluid_bath
        - sand_bath
        - heating_block
        - heating_jacket
        - radiant_heater
        - fired_heater
        - electric_heater
        - other
        - not_reported
      maximum_temperature:
        type: value
        quantity: temperature
      temperature_control:
        type: text
        description: The controller and its control point as stated (e.g. PID on the furnace thermocouple).
  TemperatureProbe:
    is_a: Instrument
    fixed:
      instrument_kind: temperature_probe
    description: What measures a reported temperature. Where it sits in the experiment is on TEMPERATURE_MEASURED_BY.
    properties:
      probe_kind:
        type: enum
        values:
        - thermocouple
        - resistance_thermometer
        - pyrometer
        - infrared_camera
        - gas_thermometer
        - other
        - not_reported
      sensor_type:
        type: text
        description: The sensor type as stated (e.g. type K, Pt100).
  ElectricHeater:
    is_a: Heater
    fixed:
      heater_kind: electric_heater
    description: 'A power supply with what couples its energy into the catalyst: a current through the
      catalyst or its support (Joule heating), an induction coil, a microwave cavity. What it heats is
      ELECTRICALLY_HEATS.'
    properties:
      heating_method:
        type: enum
        values:
        - joule
        - induction
        - microwave
        - dielectric
        - other
        - not_reported
      waveform:
        type: enum
        values:
        - dc
        - ac
        - pulsed
        - not_reported
      maximum_power:
        type: value
  Electrode:
    is_a: Sample
    fixed:
      sample_kind: electrode
    description: A working or counter electrode as a physical assembly (substrate, catalyst layer, binder);
      its role in an experiment is on USES_ELECTRODE.
    properties:
      substrate:
        type: text
      geometric_area:
        type: value
      electrochemically_active_area:
        type: value
      ecsa_method:
        type: enum
        description: How the electrochemically active surface area was measured.
        values:
        - double_layer_capacitance
        - hupd
        - co_stripping
        - metal_upd
        - redox_probe
        - other
        - not_reported
      catalyst_loading:
        type: value
        quantity: loading
  ReferenceElectrode:
    is_a: Instrument
    fixed:
      instrument_kind: reference_electrode
    required:
    - reference_type
    properties:
      reference_type:
        type: enum
        values:
        - ag_agcl
        - sce
        - hg_hgo
        - rhe
        - she
        - nhe
        - pseudo_reference
        - other
        - not_reported
      filling:
        type: text
        description: The filling solution as stated (e.g. saturated KCl, 3 M KCl); decides its potential.
      potential_vs_she:
        type: value
        quantity: electric_potential
    description: The electrode against which potentials are measured; its type and filling decide the
      conversion to another scale (reference_scale on the experiment).
  Electrolyte:
    is_a: ObjectOfStudy
    fixed:
      object_kind: system
    description: The electrolyte an electrochemical experiment runs in; its composition is HAS_COMPONENT
      to species.
    properties:
      pH:
        type: value
      conductivity:
        type: value
  ElectrochemicalCell:
    is_a: Instrument
    fixed:
      instrument_kind: electrochemical_cell
    properties:
      cell_kind:
        type: enum
        values:
        - h_cell
        - single_compartment
        - flow_cell
        - membrane_electrode_assembly
        - rotating_disk
        - other
        - not_reported
      separator:
        type: text
      compartments:
        type: integer
    description: 'The cell an electrochemical experiment runs in: its kind, separator and number of compartments.'
  LightSource:
    is_a: Instrument
    fixed:
      instrument_kind: light_source
    properties:
      source_kind:
        type: enum
        values:
        - xenon_lamp
        - mercury_lamp
        - led
        - laser
        - solar_simulator
        - sunlight
        - other
        - not_reported
      spectrum:
        type: text
        description: The emission spectrum or standard (e.g. AM1.5G) as stated.
      filters:
        type: text
      nominal_power:
        type: value
    description: 'What illuminates a photo-driven experiment: the lamp, LED, laser or sun, its spectrum,
      filters and nominal power. The irradiance at the sample is a property of the experiment.'
  PlasmaSource:
    is_a: Instrument
    fixed:
      instrument_kind: plasma_source
    properties:
      discharge_kind:
        type: enum
        values:
        - dielectric_barrier
        - glow
        - corona
        - gliding_arc
        - microwave
        - radio_frequency
        - spark
        - nanosecond_pulsed
        - other
        - not_reported
      configuration:
        type: enum
        values:
        - in_plasma
        - post_plasma
        - not_reported
        description: Whether the catalyst sits in the discharge or downstream of it.
      discharge_gap:
        type: value
      dielectric:
        type: text
    description: 'The discharge that drives a plasma-catalytic experiment: its kind, where the catalyst
      sits relative to it, the gap and the dielectric.'
  ThermalContributionAnalysis:
    is_a: Analysis
    description: An analysis that separates the thermal effect of light (heating of the catalyst) from
      its non-thermal effects (photochemical or hot-carrier) on a rate; it HAS_INPUT the illuminated experiment
      and its dark controls.
    properties:
      partition_method:
        type: enum
        values:
        - dark_control_at_matched_temperature
        - wavelength_dependence
        - intensity_dependence
        - temperature_dependence
        - isotope_labelling
        - other
        - not_reported
      thermal_contribution:
        type: value
        description: Share or rate attributed to heating, as the source defines it.
      nonthermal_contribution:
        type: value
        description: Share or rate attributed to non-thermal light effects, as the source defines it.
  Photoelectrode:
    is_a: Electrode
    description: 'An electrode whose semiconductor absorbs the light and drives the reaction at its surface:
      a photoanode or a photocathode, bare or with a co-catalyst (HAS_COMPONENT role cocatalyst) or protective
      layer.'
    properties:
      polarity:
        type: enum
        values:
        - photoanode
        - photocathode
        - not_reported
      absorber:
        type: text
        description: The light-absorbing semiconductor as stated.
      band_gap:
        type: value
      junction_kind:
        type: enum
        values:
        - semiconductor_liquid
        - buried_pn
        - heterojunction
        - tandem
        - other
        - not_reported
      protection_layer:
        type: text
  IlluminatedCell:
    is_a: ElectrochemicalCell
    description: 'An electrochemical cell built to be illuminated: the light reaches the electrogenerated
      species in solution; whether the electrode itself is shielded from the light decides whether photoelectrochemistry
      at the electrode can be ruled out.'
    properties:
      window_material:
        type: text
      light_path_length:
        type: value
      electrode_illumination:
        type: enum
        values:
        - electrode_shielded
        - electrode_illuminated
        - not_reported
edges:
  HAS_COMPONENT:
    description: A sample, catalyst, material, feed, process unit or catalyst state contains a species
      or material in a stated role. The role replaces role labels; adsorbate denotes a component adsorbed
      on a surface. A surface complex may instead be active_component when the source assigns that role.
      bound_to specifies its host, role_detail the binding geometry, and coverage its occupancy. Existing
      fractions and loadings retain their bases. Four quantities stay apart, each in its own property, by
      their contracts' dimensions; a fraction is a dimensionless share of the whole (fraction_basis says of
      what); a share relative to another component is a fraction with fraction_basis relative_to_component
      and relative_to; a concentration (mol/L, g/L) is concentration; a loading on a support is loading;
      and an absolute amount is amount.
    from:
    - Sample
    - Catalyst
    - Material
    - Feed
    - ProcessUnit
    - CatalystState
    - Electrolyte
    to:
    - ChemicalSpecies
    - Material
    properties:
      role:
        type: enum
        values:
        - active_component
        - active_phase
        - support
        - promoter
        - binder
        - dopant
        - reactant
        - diluent
        - inert
        - precursor
        - not_stated
        - other
        - adsorbate
        - ligand
        - solvent
        - cocatalyst
        - cofactor
        description: The component's role. A ligand binds the metal of a molecular complex; a solvent is the liquid a
          reaction mixture or an electrolyte is in; a cocatalyst is a second component that the catalyst needs to work
          (an activator, a photocatalyst's co-catalyst); a cofactor is the molecule or ion an enzyme needs (NAD+, a
          metal ion). As the source states it.
      role_detail:
        type: text
        description: e.g. structural or electronic promoter, as stated.
      function:
        type: list
        maturity: provisional
        items:
          type: ref
          targets:
          - Reaction
        description: The reactions or reaction steps this component performs in the containing catalyst, when the
          source assigns them (CO activation and chain growth on the oxide, C-C coupling or isomerization on the
          zeolite acid sites). Each is a Reaction record (a sub-reaction of the test's reaction, HAS_PART). It
          is the scope of the component in this catalyst, so one material in two catalysts may have two
          functions; role stays about composition.
      fraction:
        type: value
        quantity: composition_fraction
        context:
          fraction_basis: fraction_basis
        description: The component's share of the whole, dimensionless (%, 1, wt%, mol%), as fraction_basis
          says (by mass, mole, atom or volume, or relative to another component); never a concentration or an
          amount.
      fraction_basis:
        type: enum
        values:
        - mass
        - mole
        - atom
        - volume
        - not_reported
        - relative_to_component
      concentration:
        type: value
        quantity: concentration
        maturity: provisional
        description: The component's amount (mol/L) or mass (g/L, mg/m3) per volume of its mixture (the salt of an
          electrolyte, an impurity in a feed gas), or its molality (mol/kg), as stated; not a fraction.
      loading:
        type: value
        quantity: loading
        context:
          fraction_basis: loading_basis
        description: 'For a support: the loading of the active phase on it, as stated.'
      loading_basis:
        type: enum
        values:
        - mass
        - mole
        - atom
        - volume
        - not_reported
      amount:
        type: value
        description: An absolute amount of the component as stated (grams per batch, cubic metres of a
          feed gas), when the source gives amounts rather than fractions.
      relative_to:
        type: ref
        targets:
        - ChemicalSpecies
        - Material
        description: The component a fraction is stated relative to (fraction_basis relative_to_component),
          e.g. ferric hydroxide as a percentage of the zinc oxide.
      bound_to:
        type: ref
        targets:
        - Material
        - ActiveSite
        maturity: provisional
        description: The material surface or site to which this component is bound in the containing system
          or state. Use role_detail for reported binding geometry. A material host need not be an active
          site.
      coverage:
        type: value
        maturity: provisional
        description: Reported surface occupancy of this bound component. Preserve qualitative coverage
          as text_value and numerical coverage in its reported unit and basis, naming counted sites or
          surface area. Not a bulk fraction, ligand count, or coverage inferred from band intensity.
  IDENTIFIED_AS:
    description: The chemical identity of a catalyst or material whose name denotes a defined compound
      (a "zinc oxide" catalyst is ZnO).
    from:
    - Catalyst
    - Material
    to:
    - ChemicalSpecies
    - Material
  PREPARED_BY:
    from:
    - Sample
    to:
    - Preparation
    description: A sample was made by a preparation (the inverse reading of the preparation HAS_OUTPUT
      the sample).
  TREATED_BY:
    from:
    - Sample
    - Feed
    to:
    - Treatment
    properties:
      order:
        type: integer
  CHARACTERIZES:
    description: A characterization measured a sample (or a node a domain adds, such as an active site),
      in the state it was measured.
    from:
    - Characterization
    to:
    - Sample
    - ActiveSite
    properties:
      state:
        type: enum
        values:
        - fresh
        - as_prepared
        - calcined
        - reduced
        - activated
        - heat_treated
        - operating
        - aged
        - deactivated
        - regenerated
        - reactivated
        - spent
        - other
        - not_reported
    specializes: EXAMINES
  DETECTS:
    description: A characterization detects a material phase or chemical species in the system it measured.
      Molecular detection does not establish a material phase. Retain measurement conditions and evidence;
      negated records a reported non-detection, not absence of the species from the system.
    from:
    - Characterization
    to:
    - Material
    - ChemicalSpecies
    properties:
      fraction:
        type: value
        quantity: composition_fraction
      crystallite_size:
        type: value
      negated:
        type: boolean
        description: true = the characterization looked for the material and did not detect it (e.g. no
          Cr2O3 lines).
      location:
        type: enum
        values:
        - surface
        - near_surface
        - overlayer
        - bulk
        - interface
        - facet
        - whole_particle
        - separate_domain
        - not_reported
        description: Where the detected phase is, as the measurement resolves it.
        maturity: provisional
      dominance:
        type: enum
        values:
        - majority
        - minority
        - trace
        - not_reported
        description: Whether the phase is the main one, a minor one or a trace, as the source says ("dominant",
          "a few small components").
        maturity: provisional
  OF_REACTION:
    description: 'The reaction an experiment concerns: the reaction a test, analysis or computation is
      about.'
    specializes: EXAMINES
    from:
    - Analysis
    - Computation
    - CatalyticTest
    to:
    - Reaction
    properties:
      role:
        type: text
        description: e.g. "equilibrium computed", "kinetic fit".
  HAS_PARTICIPANT:
    description: A species takes part in a reaction or elementary step. One edge per source statement. With the
      coefficient of every reactant and product, and the composition (elemental_composition, or a formula that can be
      read) and charge of every species, the validator reports whether the participants balance in atoms and in charge,
      each check on its own and apart from what the source says (Reaction.balance_status); a species whose charge is not
      stated is never taken as neutral.
    from:
    - Reaction
    - ElementaryStep
    to:
    - ChemicalSpecies
    properties:
      role:
        type: enum
        values:
        - reactant
        - product
        - catalyst
        - intermediate
        - inert
      coefficient:
        type: number
        description: Signed or unsigned stoichiometric coefficient, only when stated; the role says the side (a reactant
          or a product), and a product's coefficient is never negative.
      phase:
        type: enum
        values:
        - gas
        - liquid
        - solid
        - adsorbed
        - not_reported
  PROCEEDS_VIA:
    description: A proposed route or intermediate.
    from:
    - Reaction
    to:
    - ChemicalSpecies
    - Reaction
  DEVELOPED_BY:
    from:
    - Reaction
    - Protocol
    - Catalyst
    to:
    - Person
    - Institution
    properties:
      role:
        type: text
  STEP_USES:
    description: A procedure step uses a species, or a role node a domain adds (a precursor, support,
      promoter or binder).
    from:
    - ProcedureStep
    to:
    - ChemicalSpecies
    - Material
    properties:
      amount:
        type: value
      role:
        type: text
  HAS_ELEMENTARY_STEP:
    from:
    - Mechanism
    to:
    - ElementaryStep
    properties:
      order:
        type: integer
  DESCRIBES_REACTION:
    from:
    - Mechanism
    to:
    - Reaction
  APPLIES_TO:
    description: The material a mechanism, model or descriptor refers to; the catalysis domain adds catalysts
      and sites.
    from:
    - Mechanism
    - Model
    - Descriptor
    to:
    - Material
    - Catalyst
    - ActiveSite
  TRANSITION_STATE:
    description: The atomistic model of an elementary step's transition state.
    from:
    - ElementaryStep
    to:
    - StructureModel
  RATE_CONTROL:
    description: The sensitivity of a microkinetic computation's rate to a step, at the conditions the computation states
      (its temperature, pressure and conditions) and in the catalyst state it is IN_STATE. It changes with them, so a
      sensitivity at other conditions is another computation (PART_OF the whole); it is neither the step's barrier nor an
      apparent activation energy.
    from:
    - Computation
    to:
    - ElementaryStep
    properties:
      degree_of_rate_control:
        type: value
        quantity: degree_of_rate_control
        description: The degree of rate control of the step for the rate of forming one product (its target), as
          reported.
      rate_determining:
        type: boolean
  USES_DESCRIPTOR:
    from:
    - Model
    - Computation
    to:
    - Descriptor
  HAS_REACTION_ORDER:
    from:
    - Analysis
    - Computation
    to:
    - ChemicalSpecies
    properties:
      order:
        type: value
  HAS_PHASE:
    description: A catalyst (or support, promoter, precursor, binder) contains a material as one of its
      phases, as stated or proposed by its source.
    from:
    - Catalyst
    - Material
    - CatalystState
    to:
    - Material
    properties:
      fraction:
        type: value
        quantity: composition_fraction
        context:
          fraction_basis: fraction_basis
      fraction_basis:
        type: enum
        values:
        - mass
        - mole
        - atom
        - volume
        - not_reported
      location:
        type: enum
        values:
        - surface
        - near_surface
        - overlayer
        - bulk
        - interface
        - facet
        - whole_particle
        - separate_domain
        - not_reported
        description: Where the phase is. overlayer = a layer covering another phase; separate_domain =
          in particles or regions apart from the other phases.
        maturity: provisional
      dominance:
        type: enum
        values:
        - majority
        - minority
        - trace
        - not_reported
        description: Whether the phase is the main one, a minor one or a trace, as the source says ("dominant",
          "a few small components").
        maturity: provisional
      covered_sites:
        type: list
        items:
          type: ref
          targets:
          - ActiveSite
        maturity: provisional
        description: Sites or site ensembles reported to be covered by this phase in the containing catalyst
          or state, normally an overlayer. Does not imply impermeability, complete population coverage
          or inactivity. Preserve inferred assignments in link status and evidence.
  HAS_FORMULATION:
    description: A sample is a specimen of a catalyst formulation.
    from:
    - CatalystSample
    to:
    - Catalyst
  HAS_SITE:
    description: |-
      A catalyst, a sample or a catalyst state has a site or site ensemble; the status says whether the source
      asserts or hypothesizes it. From a CatalystState, the site and the population values on the link are that
      state's (as prepared, pretreated, working, after the test): another state of the same sample has its own
      HAS_SITE, or none, and nothing is carried from one state to another or from a sample to its states. A
      population is four quantities, never one another: population_fraction (a share of a stated whole),
      site_density (per area or per mass), exposed_metal_count (the exposed atoms counted) and site_inventory (the
      sites a site-normalized rate is divided by, which the rate names with normalized_by). Each value keeps its
      origin (measured, derived, computed, assumed), its uncertainty or bound, what produced it (produced_by: the
      counting measurement, the analysis that converts an uptake into sites, the computation) and the evidence that
      states it (evidence_ids). A measured population sits on the state of the specimen it was measured on when the
      source says which; a computed one on the computed state (STATE_OF the model); one the source gives only for
      the formulation on the Catalyst, with no specimen added.
    from:
    - Catalyst
    - CatalystSample
    - CatalystState
    to:
    - ActiveSite
    properties:
      context:
        type: list
        items:
          type: ref
          targets:
          - CatalyticTest
          - Characterization
          - Computation
      population_fraction:
        type: value
        quantity: site_fraction
        maturity: provisional
        description: The share of a stated whole that this site population makes up (of the exposed atoms of an element,
          of all its atoms, of the sites of a kind), dimensionless; basis names the whole ("of exposed Cu atoms"). A
          share the source gives only in words goes in text_value ("a minority"). A share is never a denominator.
      site_density:
        type: value
        quantity: site_density
        maturity: provisional
        description: The sites of this population per surface area or per mass of the catalyst or material
          (µmol/m2, sites/nm2, µmol/g), as stated.
      exposed_metal_count:
        type: value
        quantity: site_count
        maturity: provisional
        description: The exposed (surface) atoms of the metal counted for this population, by chemisorption, titration,
          microscopy or a particle model (µmol/g, µmol), with how they were counted and what the count assumes (the
          adsorbate and its stoichiometry, the atoms per area) in definition, or in an Analysis that produced it.
          Exposed atoms are not active sites; a rate divided by them is per exposed atom.
      site_inventory:
        type: value
        quantity: site_count
        maturity: provisional
        description: The number of sites a site-normalized rate (a turnover frequency) is divided by, as the source
          counts, estimates or assumes it (µmol/g, µmol, a number of sites); the rate names it with normalized_by.
          When the source divides by the exposed atoms, the rate names exposed_metal_count instead.
  PREPARED_FROM:
    description: A sample was prepared from a starting chemical or material (the precursor role is the
      edge).
    from:
    - CatalystSample
    to:
    - ChemicalSpecies
    - Material
    properties:
      role:
        type: text
      amount:
        type: value
      supplier:
        type: text
      grade:
        type: text
  USES_CATALYST:
    description: The catalyst of a catalytic test, in the state it was tested.
    from:
    - CatalyticTest
    to:
    - CatalystSample
    properties:
      state:
        type: enum
        values:
        - fresh
        - as_prepared
        - calcined
        - reduced
        - activated
        - heat_treated
        - operating
        - aged
        - deactivated
        - regenerated
        - reactivated
        - spent
        - other
        - not_reported
      amount:
        type: value
      bed_position:
        type: integer
        description: Position of this catalyst's bed from the inlet when a test uses several beds in series
          (stacked beds, a guard bed ahead).
    specializes: EXAMINES
  LOCATED_ON:
    description: An active site is located on a material (or at its interface with another).
    from:
    - ActiveSite
    to:
    - Material
  DURING:
    description: |-
      An in-situ or operando characterization carried out during a catalytic test or procedure, including a
      treatment or procedure step. This asserts temporal overlap, not that the characterization itself measures
      catalytic activity, and not that what it observes corresponds to the performance the test reports. That
      pairing rests on what the source states besides the overlap: which specimen was observed (specimen), whether
      the kinetics were measured while the observation was made (timing), and what of the kinetics was measured, and
      whether it matched a conventional reactor or cell (kinetics, benchmark). Neither the overlap nor a change in
      time that tracks the activity makes an observed species or phase active; an assignment is a Claim with its own
      evidence.
    from:
    - Characterization
    to:
    - CatalyticTest
    - Procedure
    properties:
      specimen:
        type: enum
        maturity: provisional
        values:
        - same_specimen
        - same_batch
        - different_specimen
        - not_reported
        description: Which specimen the characterization observed, as the source states it. same_specimen = the one whose
          performance the test measures, in the same cell or reactor; same_batch = another specimen of the batch the test
          uses (in a separate cell); different_specimen = another specimen, not said to be of the same batch.
      timing:
        type: enum
        maturity: provisional
        values:
        - simultaneous
        - sequential
        - not_reported
        description: Whether the kinetics were measured while the observation was made, as the source states it (its
          protocol in note and evidence). simultaneous = during the observation, in the same run (continuously, or by
          analysing the products at intervals while it ran); sequential = before or after the observation, not during
          it.
      kinetics:
        type: enum
        maturity: provisional
        values:
        - measured
        - matched_to_benchmark
        - products_detected
        - not_measured
        - not_reported
        description: What of the kinetics was measured in the cell of the observation. measured = activity or
          selectivity measured quantitatively (rates, conversion, selectivity); matched_to_benchmark = measured so, and
          compared with that of a conventional reactor or cell, with which it agreed (the comparison in the evidence, its
          test in benchmark); products_detected = products seen, not quantified; not_measured = the reaction ran, but
          its kinetics were not measured.
      benchmark:
        type: ref
        maturity: provisional
        targets:
        - CatalyticTest
        description: The test in a conventional reactor or cell whose kinetics the cell's were compared with (kinetics
          matched_to_benchmark).
  IN_REACTOR:
    from:
    - CatalyticTest
    to:
    - Reactor
    specializes: USES_INSTRUMENT
  FED_WITH:
    from:
    - CatalyticTest
    to:
    - Feed
    specializes: HAS_INPUT
  CATALYZES:
    description: A source states that a catalyst or an active site catalyzes a reaction. That a site, phase or species
      is active (or a spectator) for a reaction in a stated catalyst state, on stated evidence, is a Claim ABOUT them
      (the checklist guidance, Assignments), which SUPPORTS and CONTRADICTS can reach.
    from:
    - Catalyst
    - ActiveSite
    to:
    - Reaction
    properties:
      context:
        type: list
        items:
          type: ref
          targets:
          - CatalyticTest
        description: The catalytic tests in which the statement holds, when the source identifies them.
  SUBSET_OF:
    maturity: provisional
    description: One product lump lies wholly inside another (C5-C11 inside C5+; olefins inside hydrocarbons
      of the same carbon window). Stated by the source or its definitions, never inferred from the carbon
      windows. Acyclic. Selectivities on a lump and on a lump it contains are not parts of one partition.
    from:
    - ProductLump
    to:
    - ProductLump
  PRODUCES:
    description: A source states that a catalyst forms a species or a product lump.
    from:
    - Catalyst
    to:
    - ChemicalSpecies
    - ProductLump
    properties:
      negated:
        type: boolean
        description: true = the source states that the catalyst does not produce the species (beyond the
          stated limit).
  CONSUMES:
    from:
    - Catalyst
    to:
    - ChemicalSpecies
  INHIBITED_BY:
    description: A catalyst, reaction or test is poisoned or inhibited by a species or material (the inhibitor
      role is the edge).
    from:
    - Catalyst
    - Reaction
    - CatalyticTest
    to:
    - ChemicalSpecies
    - Material
    properties:
      negated:
        type: boolean
        description: true when the source explicitly denies inhibition.
      inhibition_kind:
        type: enum
        values:
        - poison
        - reversible_inhibitor
        - not_stated
  COMPARED_WITH:
    from:
    - Catalyst
    to:
    - Catalyst
  TESTED_IN:
    description: A catalyst was tested in a reactor, where the source does not identify the catalytic
      test.
    from:
    - Catalyst
    to:
    - Reactor
  TESTED_WITH:
    description: A catalyst was tested with a feed, where the source does not identify the catalytic test.
    from:
    - Catalyst
    to:
    - Feed
  ON_SITE:
    from:
    - ElementaryStep
    to:
    - ActiveSite
  FEEDS_INTO:
    description: The outlet of one unit is fed to the next (a process chain), with the order and the stream
      as the source describes them.
    from:
    - ProcessUnit
    - Reactor
    to:
    - ProcessUnit
    - Reactor
    properties:
      order:
        type: integer
        description: Position of the link in the chain, from the feed inlet.
      stream:
        type: text
        description: The stream as the source names it (e.g. "make-up gas after carbon towers").
  STATE_OF:
    description: What a catalyst state is a state of (a sample, a catalyst, a material, or a model of
      it).
    from:
    - CatalystState
    to:
    - Sample
    - Catalyst
    - Material
    - Model
    maturity: provisional
  REACHED_BY:
    description: The action a state is reached by, and when it is observed relative to it.
    from:
    - CatalystState
    to:
    - Procedure
    - Experiment
    - Operation
    properties:
      timing:
        type: enum
        values:
        - during
        - after
        - not_reported
      elapsed:
        type: value
        description: Time since the start of the action when the state is observed.
    maturity: provisional
  DETERMINED_BY:
    description: A characterization, analysis, computation or catalytic test supplying evidence for the
      determination of a catalyst state. Preserve inferred or hypothesized assignments in link status,
      evidence and note; a reactivity-based assignment does not become direct structural observation.
    from:
    - CatalystState
    to:
    - Characterization
    - Analysis
    - Computation
    - CatalyticTest
    maturity: provisional
  IN_STATE:
    description: 'The catalyst state to which the source experiment''s pathway results apply: measured
      for a catalytic test, calculated for a computation, or analyzed for an analysis. Link condition-scoped
      experiments and preserve origin. This supplies result context, not evidence that a predicted state
      was observed.'
    from:
    - CatalyticTest
    - Computation
    - Analysis
    to:
    - CatalystState
    maturity: provisional
  FROM_STATE:
    description: The state or phase a transition starts from.
    from:
    - StateTransition
    to:
    - CatalystState
    - Material
    maturity: provisional
  TO_STATE:
    description: The state or phase a transition leads to.
    from:
    - StateTransition
    to:
    - CatalystState
    - Material
    maturity: provisional
  TRIGGERED_BY:
    description: The action that sets a transition off (a gas switch, a pressure step, a potential hold,
      a simulated exposure).
    from:
    - StateTransition
    to:
    - Procedure
    - Experiment
    - Operation
    maturity: provisional
    properties:
      onset_delay:
        type: value
        maturity: provisional
        description: Reported delay from the triggering action, or trigger point explicitly identified
          in this link's note, to onset of this transition. Preserve qualitative delays as text_value;
          do not invent numerical delay. Distinct from StateTransition.duration, observation elapsed time
          and a fitted relaxation time constant.
  DRIVES_TRANSITION:
    description: |-
      A species, feed, material or reaction that promotes, suppresses or reverses a transition, in a
      stated role and under stated conditions (a product that carburizes the surface at high partial
      pressure; water that quenches particle dynamics).
    from:
    - ChemicalSpecies
    - Feed
    - Material
    - Reaction
    to:
    - StateTransition
    properties:
      effect:
        type: enum
        values:
        - promotes
        - suppresses
        - reverses
        - no_effect
        - not_determined
      driver_role:
        type: enum
        values:
        - reactant
        - product
        - intermediate
        - adsorbate
        - atmosphere
        - electrolyte
        - applied_potential
        - illumination
        - temperature
        - other
        - not_stated
      conditions:
        type: map
        items:
          type: value
      mechanism:
        type: text
    maturity: provisional
  AFFECTS_PATHWAY:
    description: |-
      A state, a transition or a phase changes a reaction pathway, as the source attributes it: it
      enhances or suppresses the reaction, delays the onset of a product, or redirects selectivity. A
      statement about one product names it.
    from:
    - CatalystState
    - StateTransition
    - Material
    to:
    - Reaction
    properties:
      effect:
        type: enum
        values:
        - enhances
        - suppresses
        - delays
        - redirects_selectivity
        - no_effect
        - not_determined
      observable:
        type: enum
        values:
        - activity
        - selectivity
        - rate
        - onset
        - stability
        - other
      product:
        type: ref
        targets:
        - ChemicalSpecies
      magnitude:
        type: value
      conditions:
        type: map
        items:
          type: value
      site:
        type: ref
        targets:
        - ActiveSite
        maturity: provisional
        description: The site or site ensemble whose contribution to the target reaction is affected,
          as attributed by the source. Absence leaves site scope unspecified; it does not mean all sites
          are equally affected.
    maturity: provisional
  PREDICTS:
    description: What a computation or analysis predicts (a state, a transition, a phase, a reaction),
      and whether the prediction agrees with the observation it is compared with.
    from:
    - Computation
    - Analysis
    to:
    - CatalystState
    - StateTransition
    - Material
    - Reaction
    properties:
      agreement:
        type: enum
        values:
        - agrees
        - partly_agrees
        - disagrees
        - not_compared
      compared_with:
        type: ref
        targets:
        - CatalystState
        - StateTransition
      conditions:
        type: map
        items:
          type: value
    maturity: provisional
  HEATED_BY:
    specializes: USES_INSTRUMENT
    description: The heater of a thermally driven experiment.
    from:
    - Experiment
    to:
    - Heater
    properties:
      set_point:
        type: value
        description: The heater's set point, when it differs from the reported temperature.
  TEMPERATURE_MEASURED_BY:
    specializes: USES_INSTRUMENT
    description: The probe behind a reported temperature, and where it sits; the Experiment property temperature_measured_at
      summarizes the position when no probe record exists.
    from:
    - Experiment
    to:
    - TemperatureProbe
    properties:
      position:
        type: enum
        values:
        - catalyst_bed
        - reactor_wall
        - furnace
        - gas_inlet
        - gas_outlet
        - catalyst_surface
        - not_reported
      axial_position:
        type: value
        description: Position along the bed or reactor, as stated.
  ELECTRICALLY_HEATS:
    description: What carries the current or absorbs the field of an electric heater, and how the energy
      couples in. Structured form of the Experiment property heated_element.
    from:
    - ElectricHeater
    to:
    - Sample
    - Material
    properties:
      coupling:
        type: enum
        values:
        - current_through_catalyst
        - current_through_support
        - induction_in_catalyst
        - induction_in_susceptor
        - microwave_absorption
        - other
        - not_reported
  USES_ELECTRODE:
    specializes: HAS_INPUT
    description: An electrode or reference electrode used in an experiment, with its role.
    from:
    - Experiment
    to:
    - Electrode
    - ReferenceElectrode
    properties:
      role:
        type: enum
        values:
        - working
        - counter
        - reference
  IN_ELECTROLYTE:
    specializes: HAS_INPUT
    from:
    - Experiment
    to:
    - Electrolyte
    description: The electrolyte an electrochemical experiment runs in.
  IN_CELL:
    specializes: USES_INSTRUMENT
    from:
    - Experiment
    to:
    - ElectrochemicalCell
    description: The cell an electrochemical experiment runs in.
  ILLUMINATED_BY:
    specializes: USES_INSTRUMENT
    from:
    - Experiment
    to:
    - LightSource
    properties:
      geometry:
        type: enum
        values:
        - front
        - back
        - side
        - internal
        - not_reported
      distance:
        type: value
    description: The light source of an illuminated experiment, with its geometry and distance.
  USES_PLASMA:
    specializes: USES_INSTRUMENT
    from:
    - Experiment
    to:
    - PlasmaSource
    description: The plasma source of a plasma-driven experiment.
  DARK_CONTROL_FOR:
    specializes: CONTROL_FOR
    description: A dark experiment heated to the temperature the illuminated experiment reached; the pair
      separates photothermal from non-thermal light effects. It is a CONTROL_FOR, and states what CONTROL_FOR
      states (control_kind, differs_in) besides how, where and over which time the temperature was matched. A match of
      the bulk temperature (bed, wall or gas) alone does not show a non-thermal effect, since the illuminated surface
      can be hotter.
    from:
    - Experiment
    to:
    - Experiment
    properties:
      control_kind:
        type: enum
        values:
        - negative
        - positive
        - blank
        - baseline
        - reference
        - sham
        description: As on CONTROL_FOR (provisional here).
        maturity: provisional
      differs_in:
        type: list
        items:
          type: ref
          targets:
          - Variable
        description: The variables in which the two differ, as on CONTROL_FOR (illumination only, for a dark control).
        maturity: provisional
      temperature_matched_at:
        type: enum
        maturity: provisional
        values:
        - illuminated_surface
        - catalyst_bed
        - reactor_wall
        - gas
        - other
        - not_reported
        description: Where the matched temperature was measured, in both experiments. illuminated_surface = at the
          catalyst where the light falls (thermal imaging, a thermocouple at the surface); catalyst_bed, reactor_wall
          and gas are bulk temperatures.
      temperature_matched_over:
        type: enum
        maturity: provisional
        values:
        - steady_state
        - time_resolved
        - time_averaged
        - other
        - not_reported
        description: Over which time the temperatures correspond. steady_state = both held at a steady temperature
          while measured; time_resolved = the temperature history matched through the run (ramps, transients);
          time_averaged = equal averages only.
      temperature_matched_by:
        type: enum
        values:
        - external_heating
        - same_heater_without_light
        - other
        - not_reported
      temperature_difference:
        type: value
        quantity: temperature
        description: Remaining difference between the dark and illuminated catalyst temperatures, when
          stated.
  ILLUMINATES:
    description: A light source illuminating a photoelectrode, from which side; in a tandem or dual-photoelectrode
      cell each photoelectrode has its own link.
    from:
    - LightSource
    to:
    - Photoelectrode
    properties:
      side:
        type: enum
        values:
        - front
        - back
        - not_reported
        description: front = through the electrolyte onto the absorber; back = through the substrate.
      illuminated_area:
        type: value
  ELECTROGENERATES:
    description: An experiment in which an electrode oxidizes or reduces a species into the form that
      absorbs the light (e.g. the radical cation of a photocatalyst); structured form of the Experiment
      property excited_species.
    from:
    - Experiment
    to:
    - ChemicalSpecies
    properties:
      electron_transfer:
        type: enum
        values:
        - oxidation
        - reduction
        - not_reported
      electrons:
        type: integer
  PHOTOEXCITES:
    description: A light source exciting an (electrogenerated) species.
    from:
    - LightSource
    to:
    - ChemicalSpecies
    properties:
      excited_state:
        type: enum
        values:
        - singlet
        - triplet
        - doublet
        - other
        - not_reported
      wavelength:
        type: value
adds_properties:
  Experiment:
    heating_mode:
      type: enum
      values:
      - external_furnace
      - fluid_bath
      - radiative
      - self_heating
      - resistive
      - inductive
      - microwave
      - other
      - not_reported
      description: How heat reaches the catalyst. resistive (Joule), inductive and microwave heating are
        electrothermal (the electrothermal-catalysis domain).
    temperature_measured_at:
      type: enum
      values:
      - catalyst_bed
      - reactor_wall
      - furnace
      - gas_inlet
      - gas_outlet
      - not_reported
      description: Where the reported temperature was measured; bed and furnace temperatures can differ
        by tens of kelvin.
    temperature_profile:
      type: enum
      values:
      - isothermal
      - ramped
      - adiabatic
      - not_reported
    heating_rate:
      type: value
    hot_spot:
      type: value
      quantity: temperature
      description: The largest excess of the bed temperature over the set point, when stated.
    heated_element:
      type: text
      description: What carries the current or absorbs the field and so becomes the heat source (the catalyst,
        a carbon felt, a metal foil, a susceptor). Interface term.
    heating_power:
      type: value
      description: Electrical power converted to heat in the heated element. Interface term.
    heating_current:
      type: value
      quantity: electric_current
      description: Current through the heated element (not an electrochemical current; electrocatalysis's
        current is the current of an electrochemical cell). Interface term.
    heating_voltage:
      type: value
      quantity: electric_potential
      description: Voltage across the heated element (not a cell voltage). Interface term.
    field_frequency:
      type: value
      description: Frequency of the induction or microwave field that heats the element. Interface term.
    control_mode:
      type: enum
      values:
      - potentiostatic
      - galvanostatic
      - pulsed
      - potential_sweep
      - open_circuit
      - other
      - not_reported
    electrode_potential:
      type: value
      quantity: electrode_potential
      context:
        potential_reference: reference_scale
      description: The working-electrode potential, on the scale its unit or basis names (V vs RHE) or else the
        experiment's reference_scale. A potential converted to another scale than the experiment's is an evidenced
        conversion (origin derived or computed, with produced_by naming the conversion); one that names another scale
        without it is contradictory.
    reference_scale:
      type: enum
      description: The scale the experiment's potentials are stated on (which, when the source converts, need not be
        its reference electrode's); the potential_reference of electrode_potential and onset_potential.
      values:
      - rhe
      - she
      - nhe
      - ag_agcl
      - sce
      - hg_hgo
      - ferrocene
      - other
      - not_reported
    ir_compensation:
      type: enum
      values:
      - applied
      - partial
      - not_applied
      - not_reported
    ir_compensation_fraction:
      type: number
    cell_voltage:
      type: value
      quantity: electric_potential
      description: Voltage between the working and counter electrodes of the electrochemical cell.
    current:
      type: value
      quantity: electric_current
      description: Current through the electrochemical cell (working electrode).
    current_density:
      type: value
      quantity: current_density
      context:
        current_normalization: current_normalization
      description: The current divided by what current_normalization names (the geometric or the electrochemically
        active electrode area, or the catalyst mass); the value's own basis, unit or normalized_by may name it too and
        must agree. A geometric-area and an ECSA-normalized current density are two quantities.
    current_normalization:
      type: enum
      description: What currents are divided by; geometric and ECSA-normalized current densities are not
        comparable.
      values:
      - geometric_area
      - ecsa
      - mass
      - none
      - other
      - not_reported
    charge_passed:
      type: value
    faradaic_efficiency:
      type: list
      quantity: faradaic_efficiency
      items:
        type: value
      description: One value per product, each naming its product species in target.
    partial_current_density:
      type: list
      quantity: partial_current_density
      context:
        current_normalization: current_normalization
      items:
        type: value
    light_absorber:
      type: enum
      values:
      - catalyst
      - photoelectrode
      - molecular_photocatalyst
      - photosensitizer
      - other
      - not_reported
      description: |
        What absorbs the light. A photoelectrode (photoelectrocatalysis) or a molecular photocatalyst
        or photosensitizer turned over electrochemically (electrophotocatalysis).
    illumination:
      type: enum
      values:
      - light
      - dark
      - chopped
      - not_reported
      description: dark marks the dark control of an illuminated experiment.
    irradiance:
      type: value
      description: The irradiance at the specimen, as stated (after the optical path); where and how it was measured
        goes in irradiance_measured_by or the value's definition. A lamp's rated output is not an irradiance.
    wavelength:
      type: value
      description: A monochromatic wavelength, or a band as lower and upper.
    photon_flux:
      type: value
      description: Photons reaching the specimen per time (or per time and area), as stated; the basis of a photon-based
        yield (incident, as for an apparent quantum yield, or absorbed, as for a quantum yield).
    illuminated_area:
      type: value
    optical_path:
      type: text
      description: What the light passes through between the source and the sample (filters, windows,
        fibre, reactor wall, distance), as stated; it decides the irradiance the sample receives.
    irradiance_measured_by:
      type: text
    apparent_quantum_yield:
      type: list
      quantity: photonic_yield
      items:
        type: value
      description: One value per product (target), at the wavelength and irradiance stated.
    quantum_yield:
      type: list
      quantity: quantum_yield
      items:
        type: value
    photocatalyst_loading:
      type: value
      description: Amount of photocatalyst per volume of reaction medium or per illuminated area, as stated.
    discharge_power:
      type: value
      description: The power deposited in the plasma, as the source determines it (from current and voltage profiles
        or a Lissajous figure; the value's definition says which). The power the supply draws is power_supply_input.
    power_supply_input:
      type: value
      maturity: provisional
      description: The electrical power the plasma power supply draws (its input, or the wall-plug power), as stated.
        It is not the plasma power (discharge_power) and is never compared with it.
    specific_energy_input:
      type: value
      description: Energy per amount of gas fed (e.g. kJ/L, eV/molecule); its definition or basis says which power it
        is computed from (the plasma power or the supply's input).
    applied_voltage:
      type: value
      quantity: electric_potential
    excitation_frequency:
      type: value
    energy_yield:
      type: list
      quantity: energy_yield
      items:
        type: value
      description: Product per energy (e.g. g/kWh), one value per product (target).
    plasma_energy_efficiency:
      type: value
      quantity: efficiency
    light_induced_temperature_rise:
      type: value
      quantity: temperature
      description: Catalyst temperature rise caused by illumination, as measured.
    heat_source:
      type: enum
      values:
      - light_only
      - light_and_external
      - external_only
      - not_reported
    photocurrent_density:
      type: value
      quantity: current_density
      context:
        current_normalization: current_normalization
    photovoltage:
      type: value
      quantity: electric_potential
    onset_potential:
      type: value
      quantity: electrode_potential
      context:
        potential_reference: reference_scale
    ipce:
      type: list
      quantity: efficiency
      items:
        type: value
      description: Incident photon-to-current efficiency, one value per wavelength (variable or note).
    abpe:
      type: value
      quantity: efficiency
      description: Applied bias photon-to-current efficiency.
    excited_species:
      type: text
      description: The species that absorbs the light (e.g. the electrogenerated radical cation of the
        photocatalyst). Interface term, since it exists because the electrode generates or regenerates
        the light absorber.
context_targets:
  species:
    maturity: provisional
    description: In catalysis, the species a value is counted for (the reactant of a conversion; the product of a yield, a
      selectivity, a rate, an amount, a Faradaic efficiency, a quantum or photonic yield, an energy yield or a partial
      current density) is a chemical species or, for a class of products reported together (C5+), a product lump. A source, a dataset, a material or a catalyst never is; a product the
      source does not identify is an unresolved_target.
    targets:
    - ChemicalSpecies
    - ProductLump
  process:
    maturity: provisional
    description: In catalysis, what an energy change is of (a reaction, adsorption or activation energy) is a Reaction or
      an ElementaryStep, whose participants name the reference species; a species, a material or a structure model never
      is.
    targets:
    - Reaction
    - ElementaryStep
  structure:
    maturity: provisional
    description: In catalysis, what a total electronic energy is of is a StructureModel.
    targets:
    - StructureModel
checklist:
  description: 'What a catalytic test reports, by the driving forces it lists (CatalyticTest.driving_forces).
    Every test: the catalyst sample it uses and the reaction it concerns. A thermally driven test (thermo,
    electrothermo): its conditions, what was fed, which catalyst sample in which state and where its temperature
    was measured; heat delivered electrically (electrothermo) also how and with what power. An electrochemically
    driven test (electro): the control mode, the working-electrode potential with its reference scale
    and iR compensation, the electrolyte, the electrodes in their roles, the current, charge and Faradaic
    efficiencies. A light-driven test (photo): the light source, whether it was illuminated (and its dark
    control), the irradiance and wavelength, the illuminated area and photon-based yields. A plasma-driven
    test (plasma): the discharge and whether the catalyst sits in or after it, the electrical input and
    the specific energy input, and energy-based yields. Where forces act together, everything each asks,
    plus: light and heat, the temperature at the catalyst and how much of it the light causes; potential
    and light, the light absorber (a photoelectrode, or an electrochemically generated or regenerated
    molecular photocatalyst or photosensitizer) with the photocurrent and photovoltage or the excited
    species. A computed or measured equilibrium (test_kind equilibrium_estimate, equilibrium_measurement)
    needs no catalyst or feed and is exempt. A test that lists no driving force has unknown applicability:
    its driving-force items are neither checked nor met, and it is never complete. What a test is read as
    showing (interpretations) adds the evidence that reading needs, looked for in the records connected to the
    test: intrinsic kinetics, a transport assessment; separating light from heat, a dark control at matched
    temperature or a separation analysis; plasma-catalyst synergy, plasma-alone and catalyst-alone controls;
    material stability, the catalyst characterized during or after the test. A characterization the source calls
    operando adds a test under working conditions and a performance measured on the same specimen at a stated
    synchronization and benchmarked; a spectral fit adds its method, results, limitations and the data it fits. These
    cases are provisional.'
  basis:
  - Bligaard et al., Toward benchmarking in catalysis science, ACS Catal. 2016, doi:10.1021/acscatal.6b00183.
  - The thermal profile of the adopted catalysis schema 0.1.0 (temperature and pressure, feed composition,
    flow or residence time, heat and mass transport, conversion regime).
  - Proposed field list for electrothermal catalysis; to be checked by domain reviewers.
  - The electrochemical profile of the adopted catalysis schema 0.1.0 (reference scale, iR compensation,
    electrolyte, charge and Faradaic efficiency); field list to be checked by domain reviewers against
    community reporting guidelines for electrocatalysis.
  - The photochemical profile of the adopted catalysis schema 0.1.0 (light source, spectrum, irradiance,
    illuminated area, apparent quantum yield); field list to be checked by domain reviewers against the
    minimum reporting recommendations for light-driven catalysis.
  - Field list proposed from common reporting in plasma catalysis (discharge power, specific energy input,
    configuration); to be checked by domain reviewers.
  - Combination of the photocatalysis and thermocatalysis checklists; to be checked by domain reviewers.
  - Combination of the photocatalysis and electrocatalysis checklists; to be checked by domain reviewers.
  - Combination of the electrocatalysis and photocatalysis checklists; to be checked by domain reviewers.
  - Schweitzer, Gounder and Rioux (eds.), Addressing Rigor and Reproducibility in Thermal, Heterogeneous Catalysis,
    v1.00, 2023, doi:10.5281/zenodo.8029159, section 5, catalyst testing (performance and intrinsic kinetics as
    separate aims; transport criteria and tests reported with their methods, conditions and results; no conversion
    level that by itself shows differential operation; the catalyst-bed temperature; rates over time on stream).
  - Flaherty and Bhan, Improving the rigor and reproducibility of catalyst testing and evaluation in the
    laboratory, J. Catal. 2024, 431, 115408, doi:10.1016/j.jcat.2024.115408.
  - Bonchio et al., Best practices for experiments and reporting in photocatalytic CO2 reduction, Nat. Catal.
    2023, 6, 657, doi:10.1038/s41929-023-00992-7 (control experiments; detection limits; repeats).
  - Edgington and Seitz, Advancing the Rigor and Reproducibility of Electrocatalyst Stability Benchmarking and
    Intrinsic Material Degradation Analysis for Water Oxidation, ACS Catal. 2023, 13, 3379,
    doi:10.1021/acscatal.2c06282 (material degradation measured as such, e.g. dissolution, apart from performance).
  - Van Turnhout, Rouwenhorst, Lefferts and Bogaerts, Plasma catalysis, what is needed to create synergy?, EES
    Catal. 2025, 3, 669, doi:10.1039/D5EY00027K (synergy against plasma alone and thermal catalysis at the same
    temperature; the plasma power, not the supply's input; the catalyst characterized after the experiment).
  - Wismann et al., Electrified methane reforming, elucidating transient phenomena, Chem. Eng. J. 2021, 425,
    131509, doi:10.1016/j.cej.2021.131509 (the transient behaviour of an electrically heated reactor).
  - Wrasman et al., Recommendations for improving rigor and reproducibility in site specific characterization, J.
    Catal. 2024, 433, 115451, doi:10.1016/j.jcat.2024.115451 (sites counted with an assumed or determined adsorption
    stoichiometry, every assumption reported; site quantification under conditions relevant to the reaction, since
    the number and nature of sites change with them; the activity often dominated by a small fraction of the
    accessible sites; probe molecules may bind sites that are not active).
  - Meyer et al., Recommendations to standardize reporting, execution, and interpretation of X-ray Absorption
    Spectroscopy measurements, J. Catal. 2024, 432, 115369, doi:10.1016/j.jcat.2024.115369 (a bulk-averaging technique
    in which minority species may escape detection; fits reported with their parameters, constraints, uncertainties
    and the poorer models they were preferred to; in situ unless the kinetics at the beamline match the laboratory
    reactor's).
  - Tackett et al., Rigor and Reproducibility in Electrocatalysis, Best Practices for Operando Studies, ACS Catal. 2026,
    16, 13861, doi:10.1021/acscatal.6c01946 (operando as working conditions with quantitative activity or selectivity;
    the synchronization protocol reported; performance benchmarked against conventional cells; spectators may mask
    transient species).
  guidance: |
    Applicability: list every driving force of a test. A test that lists none has unknown applicability: its driving-force items are neither checked nor met, so it is never complete; an equilibrium (test_kind equilibrium_estimate, equilibrium_measurement) is exempt. Completeness is not validity, and neither makes a value comparable (comparison scientific decides that).
    Interpretations: record what the source reads the test as showing (interpretations), never your own reading. Each reading adds the evidence it needs, looked for in the records connected to the test; a reading without it is reported, and the test stays as it is. No conversion level, criterion value or control is required of every test.
    Heat: a transport check (Weisz-Prater, Mears, Carberry; a Madon-Boudart or Koros-Nowak test; particle size, flow rate at constant contact time or stirring varied) is an Analysis with analysis_kind transport_check that HAS_INPUT the test, with its evaluation_basis (asserted, numerical with its criterion values in results, experimental with the runs it compares as further inputs), method, verdict and the temperature it applies to. A test read as intrinsic_kinetics is checked for one, and for one that is more than asserted; system_performance is not. Directly heated catalysts (electrothermo) can be much hotter than the gas or the wall; report the temperature at the catalyst (temperature_measured_at catalyst_bed), how heating was operated in time (HAS_OPERATION: held, ramped or pulsed), and compare with a conventionally heated control at the same catalyst temperature (CONTROL_FOR, differing in heating_mode).
    Potential: a potential is comparable across papers only on a stated scale; converting to RHE needs the reference electrode's filling, the pH and the temperature, none of which may be assumed. State the iR treatment (ir_compensation) and what currents are divided by (current_normalization); a reference electrode calibrated against a reversible hydrogen electrode names that calibration (the value's calibration, an Experiment).
    Light: record the temperature, since light also heats. A reading that separates light from heat (photothermal_effect, nonthermal_light_effect) rests on a dark control at matched catalyst temperature (DARK_CONTROL_FOR, differing in illumination only, with where and over which time the temperature was matched) or on a ThermalContributionAnalysis that HAS_INPUT the test (its partition_method: wavelength, intensity or temperature dependence, isotope labelling). A match of the bulk temperature alone does not show a non-thermal effect.
    Plasma: plasma-catalyst synergy (plasma_catalyst_synergy) rests on two controls, each CONTROL_FOR the combined test: the plasma without the catalyst (an empty reactor, or the packing without its active phase) and the catalyst without plasma at the same catalyst temperature. Report the plasma power (discharge_power, from current and voltage profiles or a Lissajous figure), apart from what the supply draws (power_supply_input).
    Potential and light: separate the contributions with controls: the same test in the dark (differs in illumination) and at open circuit or without applied potential (differs in electrode potential), each CONTROL_FOR the combined test.
    Stability: a constant trace of performance (a TimeSeries the test HAS_OUTPUT) shows performance_stability, not material_stability; the material is shown unchanged by characterizing it during or after the test (a CatalystState the test reaches, REACHED_BY timing during or after, DETERMINED_BY a characterization: structure after the test, dissolution into the electrolyte). Repeats are REPLICATES links, and a planned set of repeats a Design (planned_replicates).
    Time: a test operated dynamically (pulses, ramps, switching) HAS_OPERATION an Operation with its time_pattern, the quantities it varies and its segments, so its results keep their time-dependent context.
    Sites: record a site population on the HAS_SITE from the state it was counted or observed in (as prepared, pretreated, working, after the test); sites can change with the conditions, so a count made in one state is never carried to another. A share (population_fraction), a density (site_density), the exposed atoms counted (exposed_metal_count) and the sites a rate is divided by (site_inventory) are four values, each with its origin, uncertainty or bound, and what produced it: the counting measurement, or an Analysis that converts an uptake into sites and USES_MODEL a Model stating what it assumes (the adsorbate's stoichiometry, the particle shape). A turnover frequency is kept as reported, with how it was calculated: the count it is divided by (normalized_by) and, in its basis or definition, what was counted as sites and how. A rate per exposed atom is an average over sites that may differ, not a rate per active site; a comparison shows each rate with its count. A computed population sits on the computed state, STATE_OF the model; one the source gives only for the formulation on the Catalyst, with no specimen added.
    Assignments: that a phase, site or species is active, a spectator, a precursor or an inhibitor for a reaction in a state is a Claim, ABOUT the component (role active, spectator, precursor or inhibitor), the state (role state), the reaction or product (role reaction, product), the test it concerns (role test) and any elementary step or mechanism (role step, mechanism); SUPPORTS and CONTRADICTS from the tests, characterizations, analyses and claims it rests on name the results with premise_refs. Competing assignments are claims of their own, never merged. Abundance is not activity: a majority phase is assigned nothing unless the source argues it, and a minority one can carry an assignment with its evidence.
    Operando: an observation made while the kinetics are measured. One the source calls operando is kept as such (observation_mode); the checklist looks, on its DURING link, for a catalytic test under working conditions whose kinetics were measured on the same specimen while the observation was made (specimen same_specimen, timing simultaneous, kinetics measured or matched_to_benchmark). A conventional reactor or cell the kinetics were compared with is recorded when the source gives one (kinetics matched_to_benchmark, benchmark). An overlap in time is not a pairing, and a change that tracks the activity in time does not show that what changed is active.
    Computations: a computed energy is a value of its kind (a total electronic energy, a reaction or adsorption energy, an enthalpy or a free energy, an elementary activation energy or activation free energy, an apparent activation energy, a degree of rate control), never a bare number in eV. A reaction, adsorption or activation energy names the Reaction or ElementaryStep it is the energy change of (its target, or the step that holds it), whose participants and coefficients are its reference states. The Computation that produced it states its level_of_theory and charge_treatment, which a comparison reads, and its dispersion, hubbard_u, spin_treatment, solvation, temperature, pressure and electrode potential, which it shows; its input files, environment and structures stay in versioned, checksummed Datasets (configuration, execution_environment, a model's stored_in). A state computed on a structure model is STATE_OF the model, with no specimen; the model REPRESENTS the specimen or state it stands for, with what that assumes. A machine-learned prediction names its model (USES_MODEL, with its version and stored_in), the data it was fitted to (an experiment that EVALUATES it with evaluation_kind calibration and HAS_INPUT that data as training_data) and its validation (one that EVALUATES it with evaluation_kind validation on validation_data or test_data); a validation on the data the model was fitted to is reported, never counted as independent, unless it states how it held its data out of that table (split_strategy, the folds of a cross-validation). An apparent activation energy from a fit of rates, an elementary step's activation energy and a degree of rate control at stated conditions are three quantities.
    Campaigns: an adaptive or autonomous campaign, in which an agent chooses the next experiments, is a Design of kind adaptive that states what TRACE-AI asks of its workflow: its autonomy_level as the source declares it (A0-A5), its human_oversight and interventions, the agent_policy and objectives, the safety_bounds and safety_measures, its stopping_criterion and stop_reason, and what it did with failed or excluded runs (negative_results_policy, exclusion_criteria, excluded_count). Each run is PART_OF_DESIGN with its round (iteration) and PROPOSED_BY the agent (a Software of kind agent, with its version), with what a person decided about the proposal (human_decision); a rejected proposal is a record too. A machine-learned model states its architecture, hyperparameters, training objective and uncertainty method; a validation states how it split the data (split_strategy, grouped_by) and its metrics with their uncertainty. `scale trace-ai` reads the TRACE-AI checklist on these records.
    Spectra and fits: a measured spectrum is a Dataset the characterization HAS_OUTPUT; a fit to it is an Analysis (analysis_kind spectral_fit) with its method, its fitted parameters in results (origin fitted, with their uncertainties), the references it HAS_INPUT and its limitations; an alternative model is another Analysis; a site assignment drawn from it is a Claim that cites the fitted parameters (premise_refs). Whether an ensemble signal tells phases apart depends on the technique, the data, the references and the model.
