# Invalid scale-catal documents, one defect each (built by build_fixtures.py from a valid public example).
# `scale check` and test_invalid_fixtures.py validate each one and require that it is rejected (exit 1)
# with an error message containing `error`; `reason` says why the schema must reject it.
fixtures:
  - file: dangling-link.json
    error: does not resolve
    reason: A link must join two records of the document; a target that is no record is a broken graph.
  - file: unknown-property.json
    error: is not declared for this type
    reason: Curators never invent attributes; what the schema cannot express goes in the record's unmodeled list.
  - file: value-without-status.json
    error: a value needs a status
    reason: A value says whether it is present or why it is missing; a bare number hides missingness.
  - file: enum-value-not-allowed.json
    error: is not one of
    reason: An enumerated property takes one of its listed values, so that queries can rely on them.
  - file: edge-endpoint-not-allowed.json
    error: USES_CATALYST source must be
    reason: An edge type joins only the labels it declares; a source document does not use a catalyst.
  - file: evidence-without-locator.json
    error: evidence needs locator
    reason: Evidence says where in the source a statement is (section, table, figure), so that a reader can check it.
  - file: reported-in-without-evidence.json
    error: is not backed by its evidence
    reason: REPORTED_IN is derived from a record's evidence; a link that no evidence backs asserts a source without proof.
  - file: research-data-without-stewardship.json
    error: a research_data graph declares stewardship
    reason: Research data says who contributed it, which project it belongs to and who may see it.
  - file: temperature-in-kg.json
    error: "unit 'kg' is mass (M), not a dimension of temperature"
    reason: A value is in a unit of its property's kind (the quantity contract); a temperature in kilograms is no temperature, whatever its number.
  - file: fraction-in-mol-per-litre.json
    error: "unit 'mol/L' is amount_concentration (L-3 N), not a dimension of composition_fraction"
    reason: A fraction is a dimensionless share of the whole; a concentration in mol/L is HAS_COMPONENT.concentration, so the two are never compared as one quantity.
  - file: normalized-by-without-denominator.json
    error: "normalized_by names a denominator, but temperature is not divided by one"
    reason: A normalization reference names what a normalized quantity is divided by; a temperature is divided by nothing, so the reference would assert a meaning it cannot have.
  - file: normalized-by-wrong-dimension.json
    error: "is mass_per_area (M L-2) (mg/cm2), not a denominator of current_density (area (L2), mass (M))"
    reason: A current density is divided by an electrode area or a catalyst mass; a reference to a mass per area names no such denominator.
  - file: normalized-by-unresolved-path.json
    error: "does not resolve to a property"
    reason: A normalization reference names a value the graph holds; a path to a property the record does not have cites a denominator that is not there.
  - file: product-target-is-a-source.json
    error: "its target ex:df-electro/source/paper is a Source, but the species a faradaic_efficiency is counted for is a ChemicalSpecies"
    reason: In catalysis the species an efficiency, a yield or a selectivity is counted for is a chemical species (context_targets); a source document can never qualify as a product.
  - file: result-without-variable.json
    error: "a result entry names its variable"
    reason: A result says what it is a value of (a Variable, whose quantity_kind gives its contract), so that a yield is never read as a selectivity.
  - file: result-without-id.json
    error: "a result entry has an id"
    reason: A reference names a result by its id, so that appending to the list, reordering or filtering it never redirects the reference to another assay.
  - file: result-ids-repeat.json
    error: "an id names one value"
    reason: An id that two results share names neither; a reference to it could reach either assay.
  - file: result-without-evidence-ids.json
    error: "names the evidence items that state it (evidence_ids)"
    reason: An answer cites the evidence of the result that satisfied it, never the passages of the other results of its record.
  - file: product-result-without-identity.json
    error: "a faradaic_efficiency is counted for a species: name it (target) or say the source does not identify it (unresolved_target)"
    reason: A product's identity is stated, either as the species or as unidentified; a result whose product is silently missing could be read as any product.
  - file: target-and-unresolved-target.json
    error: "target and unresolved_target do not go together"
    reason: A result refers to one species or to what the source names without identifying it, never both.
  - file: result-ref-by-position.json
    error: "names a result by its position; name it by its id"
    reason: A position in result_values names another result once the list is reordered, appended to or filtered; an id does not.
  - file: interpretation-not-in-vocabulary.json
    error: "interpretations[0]: 'catalytic_synergy' is not one of"
    reason: What a test is read as showing comes from a closed list, so that the checklist knows which evidence the reading needs; a reading the vocabulary does not name asks for nothing and would pass unchecked.
  - file: transport-basis-not-in-vocabulary.json
    error: "evaluation_basis: 'estimated' is not one of"
    reason: A transport check is asserted, numerical or experimental (or not reported); an unlisted basis would hide whether the verdict rests on a calculation, a test or neither.
  - file: has-site-from-a-test.json
    error: "HAS_SITE source must be ['Catalyst', 'CatalystSample', 'CatalystState'], got CatalyticTest"
    reason: A site population belongs to a catalyst, a sample or the catalyst state it was counted in; a test is measured in a state (IN_STATE) and has no sites of its own, so a population on a test could not say which state it holds for.
  - file: site-fraction-in-umol-per-gram.json
    error: "population_fraction: unit 'µmol/g' is amount_per_mass (M-1 N), not a dimension of site_fraction"
    reason: A population fraction is a dimensionless share of a stated whole; a number of sites per gram is a count (site_inventory or exposed_metal_count), and the two are never one quantity.
  - file: site-inventory-as-surface-area.json
    error: "site_inventory: unit 'm2/g' is M-1 L2, not a dimension of site_count"
    reason: A metal surface area is not a count of sites; turning one into the other needs a stated number of atoms per area, which is a derived value with what produced it, never an unstated assumption.
  - file: computed-site-count-without-producer.json
    error: "site_inventory: a computed value names the experiment that produced it (produced_by)"
    reason: A computed site count keeps the computation, and through it the model, that produced it, so that a count from a model is never read as one counted on a specimen.
  - file: tof-divided-by-a-share.json
    error: "is a site_fraction, not a denominator of turnover_frequency (a site_count or a site_density)"
    reason: A turnover frequency is divided by a number of sites (a count or a density); a share of sites is dimensionless like a count but is not one, so a rate divided by it is not per site.
  - file: operando-specimen-not-in-vocabulary.json
    error: "specimen: 'same_reactor' is not one of"
    reason: Which specimen an operando observation saw comes from a closed list, so that the checklist can tell an observation paired with the performance of the same specimen from one that only overlapped a run.
