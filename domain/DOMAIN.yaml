# The catalysis domain's declaration, checked by `scale domains check` and copied into every
# release. Paths are relative to domain/, except decision_record (repository-relative). `version` states
# the schema's one version (kernel and catalysis together), the manifest's (graph/scale-catal.yaml).
domain: catalysis
title: Catalysis
status: stable
founding: true
version: 0.7.7
depends_on: []
alternative_to: null
summary: 'Catalytic chemistry and its evidence: the catalysis domain''s graph schema, with one vocabulary and one checklist.'
scope: |
  In scope: catalytic chemistry and its evidence, in the catalysis domain's graph schema (the
  science kernel and graph/catalysis.yaml): one vocabulary (chemical species, materials, samples, reactions, reactors,
  preparations, characterizations, computations, mechanisms, catalysts, active sites, feeds,
  catalyst samples and catalytic tests, the role a substance plays being on the edge, and the terms
  of every driving force: heat, electrically delivered heat, an applied potential or current, light
  and plasma, and where they act together) and one checklist of what a record must and should
  report, whose items for a catalytic test apply by the driving forces it lists (driving_forces).
  Out of scope: the science kernel (core/), which changes only by a kernel change; the
  electrochemical and photochemical terms stay in the catalysis domain.
# One reviewer group for the kernel and the catalysis domain for now (governance/review-policy.yaml); a reviewer
# who joins is added here too (never invent one).
maintainers:
  team: '@hlxin'
  people:
    - name: Hongliang Xin
      github: hlxin
      since: '2026-09-26'
      roles:
        - steward
    - name: Tianyou Mou
      github: mutianyou2013
      since: '2026-10-11'
      roles:
        - maintainer
    - name: Raul Diaz
      github: diazr04
      since: '2026-10-11'
      roles:
        - maintainer
review_areas:
  - catalysis
  - thermo
  - electrothermo
  - electro
  - photo
  - plasma
graph:
  manifest: graph/scale-catal.yaml
examples:
  - examples/scale-catal
# public synthetic documents only (scale check requires every committed document to be public)
example_documents:
  graph:
    - examples/scale-catal/example.json
    - examples/scale-catal/driving-force-examples/*.json
    - examples/scale-catal/source-lifecycle/*.json
    - examples/scale-catal/comparison-examples/*.json
    - examples/scale-catal/product-measurement-examples/*.json
    - examples/scale-catal/evidence-examples/*.json
    - examples/scale-catal/state-site-examples/*.json
    - examples/scale-catal/preparation-examples/*.json
    - examples/scale-catal/computation-examples/*.json
    - examples/scale-catal/area-examples/*.json
    - examples/scale-catal/agentic-examples/*.json
    - examples/scale-catal/transient-examples/*.json
    - examples/scale-catal/method-examples/*.json
    - examples/scale-catal/synthesis-examples/*.json
    - examples/scale-catal/thermal-examples/*.json
    - examples/scale-catal/bifunctional-examples/*.json
competency: competency
tests: tests
docs: docs
# the catalysis terms mapped to ontology terms, and the subdomains of catalysis research (docs/mappings.md)
mappings: mappings/catalysis.yaml
roadmap: ROADMAP.md
decision_record: docs/decisions/0001-scale-0.1.0.md
contributors:
  - name: Hongliang Xin
    github: hlxin
    roles:
      - steward
