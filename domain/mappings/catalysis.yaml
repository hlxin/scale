# The catalysis vocabulary's labels, edge types and values mapped to terms of other ontologies
# (core/mappings/ontologies.yaml lists them), and the subdomains of catalysis research the vocabulary covers.
# A mapping says how a SCALE term relates to a term someone else defines; it changes nothing that SCALE
# validates or queries. The entries follow core/mappings/kernel.yaml, which explains `match`: exact, close,
# broad (the other term is broader), narrow (it is narrower) or related. Every term was looked up in the
# release its ontology's entry names, and none is obsolete.
#
# `subdomains` are the fourteen subdomains of catalysis research by which Ontologies4Cat classifies ontologies
# (Behr, Borgelt and Kockmann, J. Cheminform. 2024, 16, 16, doi:10.1186/s13321-024-00807-2). For each, `scale`
# lists the SCALE labels and edge types that record it and `gap` what SCALE lacks for it (both SCALE's own
# reading). `ontologies4cat` is how the authors' metadata collection rates the ontologies it holds for the
# subdomain, by its own acronyms: contained, related_narrower or related_broader (its "related: narrower" and
# "related: broader"; an ontology it rates missing is not listed). Source of these ratings:
# github.com/nfdi4cat/Ontology-Overview-of-NFDI4Cat at commit 399b788 (json/), CC BY 4.0, which rates 27
# ontologies (the paper describes 23). They are copied as the collection gives them, read by its own rule: a
# rating that says contained counts as contained, as SBO's "contained: broader" and "contained: narrower" do.
# Its entry for eNanoMapper repeats its entry for RO (the same name, OBO Relations Ontology, and the same
# ratings); both are listed as given.
#
# Checked by `scale domains check`; listed by `scale schema mappings` (`--subdomains` for the subdomains). See
# docs/mappings.md.
mapping_set: catalysis-mappings
title: The catalysis vocabulary mapped to ontology terms
maps: domain/graph/catalysis.yaml
checked: '2026-10-20'
