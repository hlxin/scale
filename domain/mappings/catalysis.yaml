areas:
  biocatalysis:
    title: Biocatalysis
    scale: []
    gap: No label for an enzyme or a whole-cell catalyst, and no quantity kind for enzyme activity.
    ontologies4cat:
      contained:
      - SBO
      related:
      - BAO
      - ChEBI
      - CHEMINF
      - EDAM
      - MS
      - OBI
      - RO
  heterogeneous_catalysis:
