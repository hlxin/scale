    - CatalystSample
    - ActiveSite
    - CatalystState
    - CatalyticTest
    - Reactor
    - Feed
    ontologies4cat:
      contained: []
      related:
      - AFO
      - ChEBI
      - CHEMINF
      - MOP
      - REX
      - RXNO
  homogeneous_catalysis:
    title: Homogeneous catalysis
    scale:
    - Catalyst
    - CatalyticTest
    gap: A molecular catalyst is a Catalyst of family molecular_complex; there is no ligand or solvent role and no
      turnover number.
    ontologies4cat:
      contained: []
      related:
      - AFO
      - ChEBI
      - CHEMINF
      - MOP
      - REX
      - RXNO
