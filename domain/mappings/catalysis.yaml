  heat_transport_and_kinetic_data:
    title: Heat, transport and kinetic data
    scale:
    - Analysis
    - Mechanism
    - ElementaryStep
    - Heater
    - TemperatureProbe
    gap: A transport check records its verdict and keeps its criterion values as results, but no quantity kind is
      declared for a transport criterion (Weisz-Prater, Mears, Carberry), a Thiele modulus or an effectiveness
      factor.
    ontologies4cat:
      contained: []
      related:
      - CAO
      - CHEMINF
      - MS
      - OntoCAPE
      - OSMO
      - VIMMP
  process_design_energy_and_cost_data:
    title: Process design, energy and cost data
    scale:
    - ProcessUnit
    gap: Energy per product is recorded for plasma tests only (specific_energy_input, energy_yield); there is no
      energy consumption for other driving forces and no cost.
    ontologies4cat:
      contained:
      - OEO
      - OntoCAPE
      related:
      - M3
      - metadata4ing
      - OSMO
      - VIMMP
