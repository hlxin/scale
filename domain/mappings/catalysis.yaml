# The catalysis vocabulary's labels, edge types and values mapped to terms of other ontologies
# (core/mappings/ontologies.yaml lists them), and the areas of catalysis research the vocabulary covers.
# A mapping says how a SCALE term relates to a term someone else defines; it changes nothing that SCALE
# validates or queries. The entries follow core/mappings/kernel.yaml, which explains `match`: exact, close,
# broad (the other term is broader), narrow (it is narrower) or related. Every term was looked up in the
# release its ontology's entry names, and none is obsolete.
#
# `areas` are the fourteen areas of catalysis research by which Ontologies4Cat classifies ontologies (Behr,
# Borgelt and Kockmann, J. Cheminform. 2024, 16, 16, doi:10.1186/s13321-024-00807-2; their metadata collection,
# github.com/nfdi4cat/Ontology-Overview-of-NFDI4Cat at 399b788, CC BY 4.0). For each area, `scale` lists the
# SCALE labels and edge types that record it, `gap` what SCALE lacks for it (both SCALE's own reading), and
# `ontologies4cat` the ontologies that collection classifies as containing the area or as related to it
# (broader or narrower), by its own acronyms.
#
# Checked by `scale domains check`; listed by `scale schema mappings` (`--areas` for the areas). See
# docs/mappings.md.
mapping_set: catalysis-mappings
title: The catalysis vocabulary mapped to ontology terms
maps: domain/graph/catalysis.yaml
checked: '2026-10-20'
mappings:
  ChemicalSpecies:
