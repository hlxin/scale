subdomains:
  biocatalysis:
    title: Biocatalysis
    scale:
    - Catalyst
    - CatalyticTest
    - HAS_COMPONENT
    gap: An enzyme's EC number goes in its identifiers, which nothing checks yet; an assay's pH and buffer are
      condition entries of the test, each with its definition.
    ontologies4cat:
      contained:
      - SBO
      related_narrower:
      - BAO
      - EDAM
      - OBI
      related_broader:
      - ChEBI
      - CHEMINF
      - eNanoMapper
      - MS
      - RO
  heterogeneous_catalysis:
    title: Heterogeneous catalysis
    scale:
    - Catalyst
    - CatalystSample
    - ActiveSite
    - CatalystState
    - CatalyticTest
    - Reactor
    - Feed
    ontologies4cat:
      contained: []
      related_narrower:
      - MOP
      - REX
      - RXNO
      related_broader:
      - AFO
      - ChEBI
      - CHEMINF
  homogeneous_catalysis:
    title: Homogeneous catalysis
    scale:
    - Catalyst
    - CatalyticTest
    gap: A catalyst loading relative to the substrate (mol%) is the amount of the catalyst a test uses, which no
      quantity kind checks.
    ontologies4cat:
      contained: []
      related_narrower:
      - MOP
      - REX
      - RXNO
      related_broader:
      - AFO
      - ChEBI
      - CHEMINF
  photocatalysis:
