# A competency question of the catalysis domain (tools/competency.py; `scale domains cq catalysis`).
# It runs on public synthetic examples, so anyone can rerun it and see the same answer.
id: CQ-17
question: Which observations the source calls operando were made while the kinetics were measured, and what does an
  assignment drawn from one rest on (the measured spectrum, the fit, its limitations)?
description: |
  Operando means characterized while the kinetics are measured. observation_mode is the source's label, kept as
  reported. DURING says only that a characterization overlapped a run; that the kinetics were measured while it was
  made rests on what the source states besides (DURING's specimen, timing, kinetics and benchmark, scale-catal 0.6.0):
  the same specimen, the kinetics measured in the cell at the same time, and, when the source gives one, a conventional
  reactor or cell they matched. The Cu K-edge XAS and the modulation-excitation infrared spectra state it; the DRIFTS
  observation only overlaps a run, so it is left out, and the catalysis checklist reports it missing
  (kinetics_while_characterizing). A measured
  spectrum (a Dataset), a fit to it (an Analysis, spectral_fit, its parameters fitted, with its limitations) and the
  assignment that cites the fit (a Claim) are three records: the assignment is not the spectrum.
documents:
  - examples/scale-catal/state-site-examples/sites-and-assignments.json
plan:
  question: Which operando observations were made while the kinetics were measured on the same specimen?
  match:
    label: Characterization
    as: observation
    where:
      - prop: observation_mode
        op: eq
        value: operando
  steps:
    - from: observation
      edge: DURING
      to: CatalyticTest
      as: test
      edge_as: overlap
      edge_where:
        - prop: specimen
          op: eq
          value: same_specimen
        - prop: timing
          op: eq
          value: simultaneous
        - prop: kinetics
          op: in
          value:
            - measured
            - matched_to_benchmark
  return:
    - observation.name
    - test.name
    - overlap.specimen
    - overlap.timing
    - overlap.kinetics
    - overlap.benchmark
  evidence: true
expect:
  status: answered
  min_rows: 2
  max_rows: 2
  values:
    observation.name:
      - Cu K-edge XAS under reaction
    overlap.kinetics:
      - matched_to_benchmark
variants:
  - description: Without those conditions, every operando observation that overlaps a run is listed, the DRIFTS one
      too, with nothing stated of its specimen, timing or kinetics.
    plan:
      steps:
        - from: observation
          edge: DURING
          to: CatalyticTest
          as: test
          edge_as: overlap
    expect:
      status: answered
      min_rows: 3
      max_rows: 3
      values:
        observation.name:
          - DRIFTS under reaction
  - description: From the assignment to the fit it cites, the spectrum fitted and the measurement that recorded it.
    plan:
      match:
        label: Claim
        as: claim
      steps:
        - from: claim
          edge: SUPPORTS
          direction: in
          to: Analysis
          as: fit
          where:
            - prop: analysis_kind
              op: eq
              value: spectral_fit
        - from: fit
          edge: HAS_INPUT
          to: Dataset
          as: spectrum
          edge_where:
            - prop: role
              op: eq
              value: data
        - from: spectrum
          edge: HAS_OUTPUT
          direction: in
          to: Characterization
          as: measurement
      return:
        - claim.name
        - claim.claim_status
        - fit.name
        - fit.results.cn_cu_zn
        - fit.limitations
        - spectrum.name
        - spectrum.data_kind
        - measurement.name
    expect:
      status: answered
      min_rows: 1
      max_rows: 1
      values:
        spectrum.data_kind:
          - spectrum
        fit.name:
          - First-shell EXAFS fit of the Cu K edge
  - description: The same spectrum has two fits, each an Analysis of its own with its limitations.
    plan:
      match:
        id: ex:ss/dataset/cu-k-spectra
        as: spectrum
      steps:
        - from: spectrum
          edge: HAS_INPUT
          direction: in
          to: Analysis
          as: fit
      return:
        - fit.name
        - fit.analysis_kind
        - fit.limitations
    expect:
      status: answered
      min_rows: 2
      max_rows: 2
      values:
        fit.analysis_kind:
          - spectral_fit
