# Competency question 1 of the three a domain needs for promotion to stable (tools/scale/competency.py).
# This one runs on the starter example to show the format: replace the question, the documents (public
# examples among DOMAIN.yaml example_documents.graph), the scale-graph query plan (docs/querying.md) and
# the expectation with a question from the new-domain request, as in domain/competency/.
# `scale domains cq __DOMAIN__` runs it.
id: 'CQ-__DOMAIN__-01'
question: 'Which open questions does the __TITLE__ starter example record, and about what?'
documents:
  - 'examples/__DOMAIN__.example.graph.json'
plan:
  question: 'Which open questions does the example record, and about what?'
  match:
    label: Question
    as: question
    where:
      - prop: question_status
        op: eq
        value: open
  steps:
    - from: question
      edge: ABOUT
      to: ObjectOfStudy
      as: object
  return:
    - question.statement
    - object.name
  evidence: true
expect:
  status: answered
  min_rows: 1
