# The __TITLE__ domain's graph schema manifest: the science kernel (core/graph/kernel.yaml) plus this
# domain's files (`domains:`; the one named after the domain is required). Its version is the schema's one
# version (kernel and domain together), which documents pin in graph.schema_version; a schema change
# freezes the earlier version into frozen/ beside it.
schema: scale-graph
version: '__VERSION__'
status: experimental
maturity: provisional
description: 'The __TITLE__ domain''s graph schema: the science kernel and the __TITLE__ domain.'
kernel: ../../core/graph/kernel.yaml
domains:
  - '__DOMAIN__.yaml'
