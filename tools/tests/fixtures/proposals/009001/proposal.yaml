id: '009001'
title: A pressure gauge for thermocatalytic tests (test fixture)
kind: scale-graph
status: proposed
opened_at: '2026-09-29T00:00:00+00:00'
proposer:
  name: SCALE test suite
  agent: true
areas:
- catalysis
- thermo
base:
  manifest: domain/graph/scale-graph.yaml
  version: 0.1.0
target_version: 0.2.0
motivation: |
  A synthetic proposal used by the tests of the proposal tools: it adds one instrument to the
  catalysis domain, so that check, approval, decision and apply can be exercised end to end.
operations:
- op: add
  file: domain/graph/catalysis.yaml
  path: nodes
  key: PressureGauge
  value:
    is_a: Instrument
    fixed:
      instrument_kind: pressure_gauge
    description: What measures a reported pressure (a Bourdon gauge, a transducer).
    properties:
      gauge_kind:
        type: enum
        values:
        - bourdon
        - transducer
        - manometer
        - other
        - not_reported
fixtures:
  pass:
  - domain/proposals/009001/fixtures/pass-pressure-gauge.json
  fail:
  - path: domain/proposals/009001/fixtures/fail-gauge-kind.json
    expect: gauge_kind
    reason: A gauge's kind comes from the declared list.
assess_documents:
- path: domain/examples/scale-graph/example.json
expected_query_changes: []
mappings_considered:
- 'Instruments: a gauge is an Instrument with its own kind, like a TemperatureProbe.'
