name: publish

# Publish scale-schema to PyPI when a reviewer publishes a GitHub release, so that
# `uvx scale-schema …` installs the official release. The tag, the package version and an existing
# official release directory must agree: tag vX.Y.Z == v<pyproject version> == releases/vX.Y.Z/,
# and that directory must verify against its RELEASE.yaml digests.
#
# PyPI trusted publishing (OIDC): no token or password is stored anywhere. This workflow uses no
# stored secrets, and none may be added at repository or organization level
# (governance/repository-settings.md).
#
# The checks below run from the tagged commit's own copy of this file, so they are not a security
# boundary. The boundary is the tag ruleset and the `pypi` environment.
#
# INERT UNTIL CONFIGURED: until the owner registers the trusted publisher below, a published GitHub release
# makes this job fail at the upload step and publishes nothing.
#
# One-time setup. Human actions; an agent never does these:
# 1. pypi.org: register a trusted publisher for the project `scale-schema` (a "pending publisher" if
#    the project does not exist yet): owner `hlxin`, repository `scale`, workflow `publish.yml`,
#    environment `pypi`.
# 2. Repository settings → Environments → `pypi` (deployment protection rules on a private personal
#    repository need a paid plan; without them the tag ruleset below is the boundary):
#    - required reviewers: @hlxin (and the reviewers, as they join);
#    - deployment branches and tags: selected tags only, rule `v*`;
#    - no environment secrets.
# 3. A tag ruleset that restricts creating, updating and deleting `v*` tags to the owner.
# The exact `gh` commands are in governance/repository-settings.md. The release procedure is in
# governance/release-process.md.

"on":
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scale-schema/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version and is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${TAG}" = "v${version}" || { echo "::error::tag ${TAG} != v${version} (pyproject.toml)"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::tag ${TAG} does not point to a commit on main"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build the sdist and the wheel
        run: pip install build && python -m build
      - name: The official release exists and verifies
        run: |
          pip install dist/*.whl
          manifest="releases/v${VERSION}/RELEASE.yaml"
          test -f "${manifest}" || { echo "::error::${manifest} does not exist; build the release first"; exit 1; }
          recorded=$(python -c "import sys,yaml;print(yaml.safe_load(open(sys.argv[1]))['release'])" "${manifest}")
          test "${recorded}" = "v${VERSION}" || { echo "::error::${manifest} records release ${recorded}"; exit 1; }
          scale-schema release verify "v${VERSION}"
          (cd /tmp && scale-schema release verify "v${VERSION}")   # the copy bundled in the wheel
      - uses: pypa/gh-action-pypi-publish@release/v1
