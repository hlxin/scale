name: ci

# The status checks the main-branch ruleset may require (governance/github/ruleset-main.json) are the job
# names below:
#   test (3.10), test (3.11), test (3.12), test (3.13), package, specification-changes.
# Renaming a job or changing the matrix
# changes those names. Update the ruleset in the same pull request; applying the ruleset is a human
# action (governance/repository-settings.md). Nothing here needs a secret.
#
# Pushes run only on main. Pull requests from shared branches run once, through pull_request.
"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Every check (the same command contributors run locally)
        run: scale check

  package:
    # A new user installs scale-catal without a checkout: build the sdist and the wheel (the wheel
    # is built from the sdist, as released), install the wheel, and run it from outside the repository
    # with only the bundled data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: pip install build && python -m build
      - name: Install the wheel
        run: pip install dist/*.whl
      - name: Run from outside the repository with bundled data
        working-directory: /tmp
        env:
          SCALE_WORKSPACE: /tmp/scale-ws
        run: |
          scale-catal status
          scale-catal call status | grep -q '"schema_version": "[0-9]'
          scale-catal call domains
          scale-catal call describe '{"names": ["CatalyticTest"], "domain": "catalysis"}' | grep -q '"when"'
          scale-catal call template '{"domain": "catalysis"}' > /tmp/template.json
          python -c "import json;print(json.dumps({'document':json.load(open('/tmp/template.json'))['document']}))" \
            | scale-catal call validate - | grep -q '"valid": true'
          scale-catal call example '{"name": "electro"}'
          scale-catal call query '{"path": "electro.json", "plan": {"match": {"label": "CatalyticTest", "as": "t"}, "return": ["t.name"]}}' \
            | grep -q '"status": "answered"'
          scale-catal skills install /tmp/skills
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
                         '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
                         '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"scale_validate","arguments":{"path":"electro.json"}}}' \
            | scale-catal mcp | tail -1 | grep -q '"isError": false'
          scale-catal release verify
          scale-catal domains list
          scale-catal graph describe CatalyticTest --domain catalysis | grep -q '"when"'   # the checklist's driving-force cases

  specification-changes:
    # Pull requests only. `scale ci spec-changes` fails when a pull request
    # - modifies, deletes or adds a file inside an existing release directory (releases/<id>/, the
    #   directories holding a RELEASE.yaml), or modifies or deletes an existing frozen file under
    #   core/graph/frozen/ or domain/graph/frozen/ (each SHA256SUMS may only gain lines); new release
    #   directories and new frozen versions are allowed, and so are edits to README and CHANGELOG files
    #   directly under releases/;
    # - changes the schema (core/graph/, the catalysis domain's graph files) without what `scale schema check`
    #   asks: the version raised by the rule (breaking: the second number; additive: the third), the base
    #   version frozen, the migration step, a test for what is added and a CHANGELOG line.
    # The reviewer's summary of a schema change is the job summary. It also prints which owners review. On
    # pushes to main the job is skipped, which counts as passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Summary of the schema change for the reviewer
        env:
          # Passed through the environment, never interpolated into the script.
          BASE_REF: ${{ github.base_ref }}
        run: scale schema check --base "origin/${BASE_REF}" --comment "$GITHUB_STEP_SUMMARY" || true
      - name: Schema changes carry their version and tests; releases and frozen versions are never edited
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scale ci spec-changes --base "origin/${BASE_REF}"
