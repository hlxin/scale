# Reviewers: every reviewer is asked, one approval is enough.
#
# CODEOWNERS names every reviewer of governance/review-policy.yaml, so GitHub requests a review from all of them on
# every new pull request (except its author). The main ruleset needs one approval. This workflow keeps the others from
# reviewing in vain:
#   - when a reviewer approves, the review requests still open are withdrawn and a comment says who approved; the
#     approver merges once the checks pass;
#   - when a push changes a pull request, every reviewer whose approval the push dismissed, or who asked for changes,
#     is asked again (GitHub does not re-request them on its own).
# A reviewer who asks for changes blocks the merge until they approve or their review is dismissed, whoever else
# approved. The workflow token comments, so no other workflow (@scale-agents) starts from it.
name: reviewers

"on":
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: reviewers-${{ github.event.pull_request.number }}

jobs:
  reviewers:
    # a pull request from a fork gets a read-only token; bots' reviews are not approvals
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name == 'pull_request' || github.event.review.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      REVIEWER: ${{ github.event.review.user.login }}
      STATE: ${{ github.event.review.state }}
    steps:
      - name: An approval withdraws the other review requests
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        run: |
          pending=$(gh api "repos/$REPO/pulls/$PR/requested_reviewers" --jq '[.users[].login] | join(" ")')
          note=""
          if [ -n "$pending" ]; then
            jq -n --arg s "$pending" '{reviewers: ($s | split(" "))}' \
              | gh api -X DELETE "repos/$REPO/pulls/$PR/requested_reviewers" --input - > /dev/null
            note=" The review requests to $(echo "$pending" | sed 's/[^ ]*/@&/g') are withdrawn: one approval is enough."
          fi
          gh pr comment "$PR" --repo "$REPO" --body "Approved by @$REVIEWER, who merges it once the checks pass.$note A reviewer who still has concerns can request changes, which blocks the merge."

      - name: A push asks again the reviewers it concerns
        if: github.event_name == 'pull_request'
        run: |
          sleep 15      # the push dismisses stale approvals; let that land first
          again=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/reviews" | jq -r --arg author "$AUTHOR" '
            add // [] | map(select(.user.type != "Bot" and .user.login != $author and .state != "COMMENTED"))
            | group_by(.user.login) | map(max_by(.submitted_at))
            | map(select(.state == "CHANGES_REQUESTED" or .state == "DISMISSED")) | map(.user.login) | join(" ")')
          if [ -n "$again" ]; then
            jq -n --arg s "$again" '{reviewers: ($s | split(" "))}' \
              | gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" --input - > /dev/null
            echo "asked again: $again"
          fi
