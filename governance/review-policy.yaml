# SCALE review policy (machine-readable), explained in governance/GOVERNANCE.md. GitHub pull-request reviews are the
# approvals and GitHub's ruleset on main enforces them. Changing this file is a governance change: it needs the same
# approval as every other pull request.
policy_version: 4

principles:
  - Anyone, a person or an agent, may suggest a change (an issue, a comment) or open a pull request. Every change,
    whatever it touches, goes through one pull request.
  - Agents do the work. @scale-agents take up every suggestion on their own, with no tag or label; a coordinator
    decides and plans, specialists implement, a verifier checks, and the team opens a pull request under its own
    GitHub identity (the Claude GitHub App), never under a person's account.
  - One person approves and merges. Any reviewer listed below may approve, including the person who suggested the
    change; GitHub does not let the author of a pull request approve it, so whoever opened it needs another
    reviewer. Agents never approve or merge.
  - A schema change raises the schema's one version (kernel and catalysis together) in the same pull request;
    a breaking change raises the second number (0.1.0 -> 0.2.0), an additive change the third (0.1.0 -> 0.1.1).
    CI checks it and posts a summary for the reviewer.
  - New concepts enter as provisional.

# The reviewers: the owner and the domain experts who join (each added here, with Write access, by a pull request;
# CODEOWNERS routes review requests to them). Any one of them approves a change. A placeholder is a seat not filled
# yet: `scale check` warns until it is replaced by a person (name and GitHub handle).
reviewers:
  team: '@hlxin'
  members:
    - name: Hongliang Xin
      github: hlxin
      since: '2026-09-26'
    - name: TODO-reviewer-2
      github: TODO-reviewer-2
      placeholder: true
    - name: TODO-reviewer-3
      github: TODO-reviewer-3
      placeholder: true

# What a pull request needs before it merges. The latest review of each reviewer counts (GitHub's review state); a
# reviewer whose latest review requests changes blocks until they approve or their review is dismissed.
approvals:
  required: 1

# The kinds of change, stated in CI's summary so that the reviewer knows what they review; every kind needs the same
# one approval.
tiers:
  0:
    name: no change in meaning
    examples: documentation, tooling, typos
  1:
    name: records
    examples: new curation, corrections of curated values
  2:
    name: additive or loosening
    examples: new class, property, enum value or quantity kind; refined definitions; deprecations; mappings
    needs: the third version number raised (scale schema bump), a test that uses what is added
  3:
    name: breaking or redefining
    examples: removals, narrowed ranges, newly required properties, changed normalization basis, renames
    needs: the second version number raised (scale schema bump) and a migration rule (STEP_RULES in
      tools/scale/pgraph_migrate.py)

new_concepts_maturity: provisional

# Records extracted by an agent: how many a person checks against the sources (scale review sample).
records:
  agent_extracted_records:
    full_check_first_batches: 3
    sample_fraction: 0.1
    always_check: flagged records (warnings, extraction-error gaps, low-confidence notes)
