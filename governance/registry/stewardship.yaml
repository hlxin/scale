# Institutions, people, curation software and projects that contribute to SCALE graphs.
# Edited by people and reviewed like any specification. Add a partner institution, person or project
# here, then reference its id from a graph's stewardship file. Leave identifiers out rather than guess them.
institutions:
  - id: scale:org/virginia-tech
    name: Virginia Tech
    institution_kind: university
    country: US
    note: add the ROR id
  - id: scale:org/alchemic-ai
    name: Alchemic AI
    institution_kind: company
    note: add the ROR id if one exists
  - id: scale:org/arpa-e
    name: Advanced Research Projects Agency-Energy (ARPA-E)
    institution_kind: funding_agency
    country: US
    note: add the ROR id
persons: []
software: []
projects:
  - id: scale:project/arpa-e-catalyst
    name: ARPA-E CATALYST
    funded_by: scale:org/arpa-e
    note: add the award id and dates
    participants:
      - member: scale:org/virginia-tech
        role: data_provider
      - member: scale:org/alchemic-ai
        role: data_provider
