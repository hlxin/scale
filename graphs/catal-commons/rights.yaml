# Rights of the sources of catal-commons (scale.rights; scale evidence report): one entry per source, added with
# the source (class, licence, basis, text_chars). A source without an entry counts as in copyright.
# limits: graphs/ quotes no text of a source in copyright (0 characters); its quotes are withheld as sha256 and length,
# which anyone holding the source restores (scale evidence rehydrate). Public-domain and openly licensed sources are
# quoted in full.
limits:
  quote_chars: 0
  source_chars: 0
sources: {}
