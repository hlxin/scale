question: Has CO2 hydrogenation to methanol been reported, over which catalysts, and at what temperatures and pressures?
use_case: related-work and novelty search ("has this been done?")
match:
  label: CatalyticTest
  as: test
steps:
- from: test
  edge: OF_REACTION
  to: Reaction
  as: reaction
  where:
  - prop: id
    op: eq
    value: ex:msyn/reaction/co2-hydrogenation-to-methanol
- from: test
  edge: USES_CATALYST
  to: CatalystSample
  as: sample
- from: sample
  edge: HAS_FORMULATION
  to: Catalyst
  as: catalyst
published_before: '1966-01-01'
return:
- catalyst.name
- test.name
- test.temperature
- test.pressure
- test.conversion
- test.yield
evidence: true
limit: 60
