question: Has CO2 hydrogenation to methanol over a catalyst containing both Cu and Zn been reported, and at what
  temperatures and pressures?
use_case: related-work and novelty search ("has this been done?")
note: |
  Expected status missing_context, not no_matching_record. In the 55 public sources, 17 catalysts tested with CO2 have
  no curated components, so the graph cannot say whether any of them contained Cu and Zn. An agent must report
  "cannot be decided from this graph (components not curated)", never "this has not been done". uc2 is the broader
  question that does return rows.
match:
  label: CatalyticTest
  as: test
steps:
- from: test
  edge: OF_REACTION
  to: Reaction
  as: reaction
  where:
  - prop: id
    op: eq
    value: ex:msyn/reaction/co2-hydrogenation-to-methanol
- from: test
  edge: USES_CATALYST
  to: CatalystSample
  as: sample
- from: sample
  edge: HAS_FORMULATION
  to: Catalyst
  as: catalyst
- from: catalyst
  edge: HAS_COMPONENT
  to: ChemicalSpecies
  as: copper
  where:
  - prop: formula
    op: in
    value: [Cu, CuO, Cu2O]
- from: catalyst
  edge: HAS_COMPONENT
  to: ChemicalSpecies
  as: zinc
  where:
  - prop: formula
    op: in
    value: [Zn, ZnO]
published_before: '1966-01-01'
return:
- catalyst.name
- test.name
- test.temperature
- test.pressure
- test.conversion
- test.yield
evidence: true
order_by:
- var: test
  prop: pressure
limit: 60
