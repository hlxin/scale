question: Which catalysts were tested for methanol synthesis and found (nearly) inactive, and under what conditions?
use_case: capturing and learning from negative results ("why didn't this work?")
match:
  label: CatalyticTest
  as: test
steps:
- from: test
  edge: USES_CATALYST
  to: CatalystSample
  as: sample
- from: sample
  edge: HAS_FORMULATION
  to: Catalyst
  as: catalyst
- from: test
  edge: OF_REACTION
  to: Reaction
  as: reaction
  where:
  - prop: id
    op: in
    value:
    - ex:msyn/reaction/co-hydrogenation-to-methanol
    - ex:msyn/reaction/co2-hydrogenation-to-methanol
where:
- var: test
  prop: conversion
  op: le
  value: 2
  unit: '%'
  basis: per cent of the entering carbon monoxide converted to methanol
published_before: '1966-01-01'
return:
- catalyst.name
- test.name
- test.temperature
- test.pressure
- test.space_velocity
- test.conversion
evidence: true
order_by:
- var: test
  prop: conversion
limit: 60
