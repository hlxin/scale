question: What evidence published before 1966 supports retaining Cu while seeking lower-temperature methanol
  synthesis?
manuscript: 'Methanol synthesis: from historical evidence to catalyst design — first query'
match:
  label: CatalyticTest
  as: test
steps:
- from: test
  edge: USES_CATALYST
  to: CatalystSample
  as: sample
- from: sample
  edge: HAS_FORMULATION
  to: Catalyst
  as: catalyst
- from: catalyst
  edge: HAS_COMPONENT
  to: ChemicalSpecies
  as: copper
  where:
  - prop: formula
    op: in
    value:
    - Cu
    - CuO
    - Cu2O
- from: test
  edge: OF_REACTION
  to: Reaction
  as: reaction
  where:
  - prop: id
    op: in
    value:
    - ex:msyn/reaction/co-hydrogenation-to-methanol
    - ex:msyn/reaction/co2-hydrogenation-to-methanol
where:
- var: test
  prop: temperature
  op: exists
published_before: '1966-01-01'
return:
- catalyst.name
- test.name
- test.temperature
- test.pressure
- test.space_velocity
- test.production_rate
- test.space_time_yield
- test.yield
- test.conversion
- reaction.equation
evidence: true
order_by:
- var: test
  prop: temperature
limit: 60
