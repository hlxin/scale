  EDAM:
    name: EDAM, the ontology of data analysis and management
    iri: http://edamontology.org/
    pattern: ^EDAM:(data|format|operation|topic)_\d{4}$
    homepage: https://edamontology.org/
    licence: CC BY-SA 4.0
    checked: EDAM 1.25-20260626 (EBI OLS, 2026-10-20)
