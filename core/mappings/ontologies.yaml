# The ontologies and vocabularies that SCALE's terms are mapped to (core/mappings/kernel.yaml and
# domain/mappings/catalysis.yaml). SCALE does not take its meaning from them; a mapping only says how a SCALE
# term relates to a term someone else defines, so that data can be found and exchanged across both.
#
# A term is written as a CURIE, `<prefix>:<local id>`; `iri` is what the prefix stands for, so the term's IRI is
# `iri` followed by the local id, and `pattern` is what a term of the vocabulary looks like. `checked` names the
# release the mapped terms were looked up in (each term's identifier and label, and that it is not obsolete).
# `licence` is the licence the vocabulary states for itself, left out where its files state none; mappings cite
# identifiers and labels only, never definitions. `ontologies4cat` names the ontology by its acronym in the
# metadata collection of Ontologies4Cat (Behr, Borgelt and Kockmann, J. Cheminform. 2024, 16, 16,
# doi:10.1186/s13321-024-00807-2), whose ratings by subdomain of catalysis research are in
# domain/mappings/catalysis.yaml (subdomains), with their source.
#
# Checked by `scale domains check`; listed by `scale schema mappings`. See docs/mappings.md.
ontologies:
  af-e:
    name: Allotrope Foundation Ontology, equipment
    iri: http://purl.allotrope.org/ontologies/equipment#
    pattern: ^af-e:AFE_\d{7}$
    homepage: https://www.allotrope.org/ontologies
    licence: Creative Commons Attribution (the ontology's dct:license)
    checked: AFO merged REC/2026/09 (EBI OLS, 2026-10-20)
    ontologies4cat: AFO
  af-p:
    name: Allotrope Foundation Ontology, process
    iri: http://purl.allotrope.org/ontologies/process#
    pattern: ^af-p:AFP_\d{7}$
    homepage: https://www.allotrope.org/ontologies
    licence: Creative Commons Attribution (the ontology's dct:license)
    checked: AFO merged REC/2026/09 (EBI OLS, 2026-10-20)
    ontologies4cat: AFO
  af-rl:
    name: Allotrope Foundation Ontology, role
    iri: http://purl.allotrope.org/ontologies/role#
    pattern: ^af-rl:AFRL_\d{7}$
    homepage: https://www.allotrope.org/ontologies
    licence: Creative Commons Attribution (the ontology's dct:license)
    checked: AFO merged REC/2026/09 (EBI OLS, 2026-10-20)
    ontologies4cat: AFO
  BFO:
    name: Basic Formal Ontology
    iri: http://purl.obolibrary.org/obo/BFO_
    pattern: ^BFO:\d{7}$
    homepage: https://basic-formal-ontology.org/
    licence: CC BY 4.0
    checked: BFO 2019-08-26 (EBI OLS, 2026-10-20)
    ontologies4cat: BFO
  CHEBI:
    name: Chemical Entities of Biological Interest
    iri: http://purl.obolibrary.org/obo/CHEBI_
    pattern: ^CHEBI:\d+$
    homepage: https://www.ebi.ac.uk/chebi/
    licence: CC BY 4.0
    checked: ChEBI release 256 (EBI OLS, 2026-10-20)
    ontologies4cat: ChEBI
  CHEMINF:
    name: Chemical Information Ontology
    iri: http://semanticscience.org/resource/CHEMINF_
    pattern: ^CHEMINF:\d{6}$
    homepage: https://github.com/semanticchemistry/semanticchemistry
    licence: CC0 1.0
    checked: CHEMINF 2.1.0 (EBI OLS, 2026-10-20)
    ontologies4cat: CHEMINF
  CHMO:
    name: Chemical Methods Ontology
    iri: http://purl.obolibrary.org/obo/CHMO_
    pattern: ^CHMO:\d{7}$
    homepage: https://github.com/rsc-ontologies/rsc-cmo
    licence: CC BY 4.0
    checked: CHMO 2026-05-28 (EBI OLS, 2026-10-20)
    ontologies4cat: CHMO
  COB:
    name: Core Ontology for Biology and Biomedicine
    iri: http://purl.obolibrary.org/obo/COB_
    pattern: ^COB:\d{7}$
    homepage: https://obofoundry.org/COB/
    licence: CC0 1.0
    checked: COB 2025-12-15 (EBI OLS, 2026-10-20)
  dcat:
    name: Data Catalog Vocabulary (W3C)
    iri: http://www.w3.org/ns/dcat#
    pattern: ^dcat:[A-Za-z]+$
    homepage: https://www.w3.org/TR/vocab-dcat-3/
    licence: CC BY 4.0
    checked: https://www.w3.org/ns/dcat.ttl (2026-10-20)
  dcterms:
    name: DCMI Metadata Terms
    iri: http://purl.org/dc/terms/
    pattern: ^dcterms:[A-Za-z]+$
    homepage: https://www.dublincore.org/specifications/dublin-core/dcmi-terms/
