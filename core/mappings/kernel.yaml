    label: Person
  Institution:
  - match: close
    term: OBI:0000245
    label: organization
  - match: close
    term: schema:Organization
    label: Organization
  - match: close
    term: prov:Organization
    label: Organization
  Project:
  - match: close
    term: schema:ResearchProject
    label: ResearchProject
  Software:
  - match: close
    term: IAO:0000010
    label: software
  - match: close
    term: schema:SoftwareApplication
    label: SoftwareApplication
  - match: related
    term: prov:SoftwareAgent
