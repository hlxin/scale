    potential_reference:
      description: The scale an electrode potential is stated on, named by its reference electrode. Potentials on two
        scales differ by an offset that depends on the electrolyte's pH, the reference's filling and the temperature;
        a comparison never assumes one.
      read_from: [unit, basis, definition, sibling]
      values:
        rhe:
          terms: [RHE, reversible hydrogen electrode]
        she:
          terms: [SHE, standard hydrogen electrode]
        nhe:
          terms: [NHE, normal hydrogen electrode]
        ag_agcl:
          terms: [Ag/AgCl, Ag|AgCl, silver chloride electrode]
        sce:
          terms: [SCE, saturated calomel electrode, calomel electrode]
        hg_hgo:
          terms: [Hg/HgO, Hg|HgO, mercury oxide electrode]
        ferrocene:
          terms: [Fc/Fc+, Fc+/Fc, ferrocene, ferrocenium]
      unspecified: [other, not_reported]
    current_normalization:
      description: What an electric current is divided by. A current per geometric (projected) electrode area, per
        electrochemically active surface area (ECSA) and per catalyst mass are three quantities; their numbers are
        never compared with one another.
      read_from: [unit, basis, definition, normalized_by, sibling]
      values:
        geometric_area:
          terms: [geometric, geometric area, geometric surface area, projected area, geo, geometric_area]
          dimensions: [current_density]
        ecsa:
          terms: [ECSA, electrochemically active surface area, electrochemically active area, electrochemical surface area, electrochemically_active_area]
          dimensions: [current_density]
        mass:
          terms: [catalyst mass, per gram of catalyst, mass activity, mass-normalized, mass normalized]
          dimensions: [specific_current]
        none:
          terms: [not normalized, unnormalized]
          dimensions: []
      unspecified: [other, not_reported]
    pressure_convention:
      description: Whether a pressure is absolute or gauge (above the ambient pressure). The two differ by the ambient
        pressure, about 0.1 MPa, which matters most at low pressure; a unit that does not say (atm, bar, MPa) states
        neither.
      read_from: [unit, basis, definition]
      values:
        absolute:
          terms: [absolute, abs, (a)]
        gauge:
          terms: [gauge, gage, (g)]
    flow_reference:
      description: The conditions a gas volume, and so a volumetric flow or a gas space velocity, is counted at.
        Volumes at standard, normal and operating conditions differ by the ratio of temperatures and pressures; the
        conditions must be stated for two such numbers to be compared.
      read_from: [unit, basis, definition]
      values:
        stp:
          terms: [STP, S.T.P., standard temperature and pressure]
        ntp:
          terms: [NTP, N.T.P., normal temperature and pressure]
        satp:
          terms: [SATP]
        normal:
          terms: [normal conditions, normal state]
        standard:
          terms: [standard conditions, std. cond., standard volume]
        actual:
          terms: [actual conditions, operating conditions, reaction conditions, reactor conditions]
    fraction_basis:
      description: What a fraction or a loading counts, by mass, by amount of substance, by atoms or by volume, or
        relative to another component rather than to the whole (then refined by the component it is relative to).
      read_from: [unit, basis, definition, sibling]
      values:
        mass:
          terms: [mass fraction, by mass, by weight, w/w, mass basis, weight basis]
        mole:
          terms: [mole fraction, mol fraction, molar fraction, by mole, molar basis, amount fraction]
        atom:
          terms: [atom fraction, atomic fraction, atomic basis, atomic ratio]
        volume:
          terms: [volume fraction, by volume, v/v, volume basis]
        relative_to_component:
          terms: [relative to component]
      unspecified: [not_reported]
      refine:
        relative_to_component: relative_to
    space_velocity_basis:
      description: What a space velocity divides by what. A gas (GHSV) or liquid (LHSV) volumetric flow per catalyst
        volume and a mass flow per catalyst mass (WHSV) are all in reciprocal time; a volumetric flow per catalyst
        mass is a quantity of its own dimension.
      read_from: [unit, basis, definition]
      values:
        ghsv:
          terms: [GHSV, gas hourly space velocity]
          dimensions: [frequency]
        lhsv:
          terms: [LHSV, liquid hourly space velocity]
          dimensions: [frequency]
        whsv:
          terms: [WHSV, weight hourly space velocity, mass hourly space velocity]
          dimensions: [frequency]
        volume_per_catalyst_mass:
          terms: [GHSV, per catalyst mass, per gram of catalyst]
          dimensions: [volume_per_mass_time]
    species:
      description: The species a value is counted for, named by its target, the product of a selectivity, a yield, a
        rate, an amount, a Faradaic efficiency, a quantum yield or a partial current density, the reactant of a
        conversion. Shares to two species are two quantities. A product the source does not identify (unresolved_target)
        names no species; a domain says which records a species is (context_targets).
      read_from: [target]
      open: true
    balance_basis:
      description: What a balance counts, carbon atoms, charge (electrons), another element or the mass. A carbon and a
        charge balance of one experiment are two quantities, never compared with one another.
      read_from: [basis, definition]
      values:
        carbon:
          terms: [carbon balance, carbon basis, C balance, carbon atoms, carbon]
        charge:
          terms: [charge balance, Faradaic balance, electron balance, total Faradaic efficiency, sum of Faradaic efficiencies, charge]
        hydrogen:
          terms: [hydrogen balance, H balance]
        oxygen:
          terms: [oxygen balance, O balance]
        nitrogen:
          terms: [nitrogen balance, N balance]
        mass:
          terms: [mass balance, total mass]
    transport_criterion:
      description: Which criterion a transport check computed. The Weisz-Prater criterion judges diffusion in the pores,
        the Carberry number mass transfer to the particle, the Anderson criterion heat in the particle, and Mears gave
        criteria for both mass and heat transfer (transport_mode says which); values of two criteria are two
        quantities, never compared with one another. Read from the value's basis or definition.
      read_from: [basis, definition]
      values:
        weisz_prater:
          terms: [Weisz-Prater, Weisz–Prater, Weisz Prater, Weisz-Prater criterion, Weisz-Prater modulus, Weisz-Prater parameter]
        mears:
          terms: [Mears, Mears criterion]
        carberry:
          terms: [Carberry, Carberry number]
        anderson:
          terms: [Anderson, Anderson criterion]
      unspecified: [other, not_reported]
    transport_mode:
      description: What a Mears criterion judges. Mears gave criteria for mass transfer between the fluid and the
        particle (external diffusion) and in it, and for heat transfer between the fluid and the particle, in it and
        across a fixed bed, each its own formula; a Mears value is compared only with one of the same, as its basis or
        definition names it. One that names only heat or mass transfer, or nothing (a Mears criterion), is left out of
        a comparison, never guessed.
      read_from: [basis, definition]
      values:
        external_mass_transfer:
          terms: [external diffusion, external mass transfer, external mass-transfer, interphase mass transfer, interphase diffusion, film diffusion, mass transfer to the particle, mass transfer to the catalyst surface]
        internal_mass_transfer:
          terms: [internal diffusion, internal mass transfer, pore diffusion, intraparticle diffusion, intraparticle mass transfer]
        external_heat_transfer:
          terms: [external heat transfer, interphase heat transfer, interphase heat transport, film heat transfer, heat transfer to the particle, heat transfer between the fluid and the particle]
        internal_heat_transfer:
          terms: [internal heat transfer, intraparticle heat transfer, intraparticle heat transport]
        bed_heat_transfer:
          terms: [radial heat transfer, radial heat transport, bed heat transfer]
      unspecified: [other, not_reported]
    characteristic_length:
      description: The length a Thiele modulus is computed with, the particle radius or the particle volume over its
        external surface (Aris; a third of the radius for a sphere), as its basis or definition names it. Moduli with
        two lengths are two quantities.
      read_from: [basis, definition]
      values:
        particle_radius:
          terms: [particle radius, pellet radius, radius of the particle, radius of the pellet, sphere radius]
        volume_to_surface:
          terms: [volume to surface, volume-to-surface, volume to external surface, Vp/Sp, V_p/S_p, Aris]
      unspecified: [other, not_reported]
    thiele_form:
      description: Which Thiele modulus a value is, the one of a first-order reaction or one generalized to another rate
        form (Bischoff), as its basis or definition names it; a generalized modulus is named as such, not by the order
        of its reaction.
      read_from: [basis, definition]
      values:
        first_order:
          terms: [first order, first-order]
        generalized:
          terms: [generalized, generalised, Bischoff]
      unspecified: [other, not_reported]
    effectiveness_basis:
      description: Which effectiveness factor a value is, the internal one (the rate in the particle over the rate at
        its external surface conditions) or the overall one (over the rate at the bulk fluid conditions, external
        transfer included), as its basis or definition names it.
      read_from: [basis, definition]
      values:
        internal:
          terms: [internal effectiveness factor, internal effectiveness, intraparticle effectiveness]
        overall:
          terms: [overall effectiveness factor, overall effectiveness]
      unspecified: [other, not_reported]
    energy_input:
      description: Which energy an energy consumption counts, the electrical input (to a cell, a stack or a plasma),
        the heat supplied, or every input (primary energy), as its basis or definition names it.
      read_from: [basis, definition]
      values:
        electrical:
          terms: [electrical energy, electric energy, electricity, electrical input, electrical power, electric power, power supply, plasma power, discharge power, wall-plug, wall plug]
        heat:
          terms: [heat input, heat supplied, heat duty, thermal energy, thermal input]
        total:
          terms: [primary energy, total energy input, all energy inputs, every energy input]
      unspecified: [other, not_reported]
    system_boundary:
      description: What an energy consumption is counted over, the device (a cell, a stack, a reactor, a discharge) or
        the process around it (a plant, with separation or compression), as its basis or definition names it. Values
        over two boundaries are two quantities.
      read_from: [basis, definition]
      values:
        device:
          terms: [cell, stack, electrolyzer, electrolyser, reactor, discharge]
        process:
          terms: [plant, whole process, entire process, separation, compression, balance of plant, downstream processing]
      unspecified: [other, not_reported]
    process:
      description: What an energy change is of, the reaction or elementary step its target names (or that holds it). Its
        reactants and products, with their coefficients and phases, define the energy, the reference species included,
        and its direction gives the sign (products minus reactants). An O adsorption energy relative to H2O and H2 and one
        relative to O2 are energies of two reactions, never compared with one another; a binding energy that a source
        reports as positive for stronger binding is the energy of the reverse reaction, a desorption. A domain says which
        records a process is (context_targets).
      read_from: [target, record]
      open: true
    structure:
      description: The structure model a total energy is of, its target or the record that holds it. Total energies of two
        structures are two quantities; their difference is a reaction energy. A domain says which records a structure is
        (context_targets).
      read_from: [target, record]
      open: true
    level_of_theory:
      description: The electronic-structure method a computed energy comes from, as the experiment that produced it states
        it in its level_of_theory (the exchange-correlation functional of a DFT calculation, such as RPBE or BEEF-vdW;
        another method by its name; a machine-learned model by its name and checkpoint). Energies from two methods are
        never compared with one another. It is read from the producer (the experiment the value's produced_by names, then
        the experiment that holds it); a producer whose label has no level_of_theory (a measurement, a fit) has none to
        state, and its values are compared apart from computed ones, never left out.
      read_from: [producer]
      property: level_of_theory
      open: true
    charge_treatment:
      description: Whether a computed energy holds the number of electrons fixed (constant charge, as in an ordinary
        calculation of a neutral or charged cell) or holds the electrode potential while the number of electrons varies
        (constant potential, a grand-canonical energy). The two are different energies, compared only when the source
        converts one into the other (an evidenced conversion whose produced_by names the conversion). A value whose
        producer does not state it is compared only with others that do not state it either.
      read_from: [basis, definition, producer]
      property: charge_treatment
      values:
        constant_charge:
          terms: [constant charge, constant-charge, fixed charge, fixed number of electrons, constant number of electrons]
        constant_potential:
          terms: [constant potential, constant-potential, constant electrode potential, constant inner potential, grand canonical, grand-canonical, grand potential, fixed potential]
        other:
          terms: []
      unspecified: [not_reported]
      unstated: group
  kinds:
    temperature:
      description: A thermodynamic temperature, or a difference of temperatures, as reported.
      dimensions: [temperature]
    pressure:
      description: A pressure, absolute or gauge as stated.
      dimensions: [pressure]
      compare_by: [pressure_convention]
    electrode_potential:
      description: The potential of an electrode measured against a reference electrode; it is comparable only on one
        reference scale, stated or converted with evidence.
      dimensions: [electric_potential]
      compare_by: [potential_reference]
    electric_potential:
      description: An electric potential difference between two stated points (a cell voltage, an applied or a heating
        voltage, a photovoltage), with no reference scale.
      dimensions: [electric_potential]
    electric_current:
      description: An electric current.
      dimensions: [electric_current]
    current_density:
      description: An electric current divided by an electrode area or a catalyst mass (IUPAC mean current density); the
        denominator decides the quantity.
      dimensions: [current_density, specific_current]
      compare_by: [current_normalization]
      denominator:
        description: The electrode area (geometric or electrochemically active) or the catalyst mass the current is divided by.
        dimensions: [area, mass]
    partial_current_density:
      description: The part of a current density that forms one product (its target), divided as the current density is.
      dimensions: [current_density, specific_current]
      compare_by: [current_normalization, species]
      denominator:
        description: The electrode area (geometric or electrochemically active) or the catalyst mass the current is divided by.
        dimensions: [area, mass]
    fraction:
      description: A part of a whole (a duty cycle), dimensionless; a basis the value states is compared as text.
      dimensions: [dimensionless]
      share: true
    species_fraction:
      description: A share counted for one species, its target, that is not one of the shares below (a conversion, a
        yield or a selectivity is its own kind), dimensionless; a basis (carbon, molar) the value states is compared as
        text.
      dimensions: [dimensionless]
      compare_by: [species]
      share: true
    conversion:
      description: The share of a reactant (its target) that was converted, on the basis the value states (per pass or
        overall; carbon or molar), dimensionless. A conversion is of a reactant, a yield and a selectivity are of a
        product; the three are never compared with one another.
      dimensions: [dimensionless]
      compare_by: [species]
      share: true
      maturity: provisional
    product_yield:
      description: The amount of one product (its target) formed relative to the amount of a reactant fed, on the basis
        the value states (carbon, molar, mass), dimensionless. A yield counts what was fed; it is a conversion times a
        selectivity, never a selectivity.
      dimensions: [dimensionless]
      compare_by: [species]
      share: true
      maturity: provisional
    selectivity:
      description: The share of the reactant converted, or of the products formed, that is one product (its target), on
        the basis the value states (carbon, molar, mass), dimensionless. A selectivity counts what was converted, not
        what was fed.
      dimensions: [dimensionless]
      compare_by: [species]
      share: true
      maturity: provisional
    production_rate:
      description: The amount, mass or gas volume of one species (its target) formed per time, or consumed for a reactant
        (its definition says so), alone or divided by the amount of catalyst, a volume or an electrode or illuminated
        area (a space-time yield, a mass-normalized rate); the unit's dimension and the denominator decide the quantity,
        and a volumetric rate is comparable only at one stated reference condition.
      dimensions: [molar_flow, mass_flow, volumetric_flow, frequency, amount_per_mass_time, amount_per_volume_time, amount_per_area_time, mass_per_volume_time]
      compare_by:
      - species
      - context: flow_reference
        when_dimension: [volumetric_flow]
      denominator:
        description: The catalyst mass, the catalyst or reactor volume, or the electrode or illuminated area the rate is
          divided by.
        dimensions: [mass, volume, area]
      maturity: provisional
    product_amount:
      description: The amount, mass or gas volume of one species (its target) formed, or consumed, over the interval of its
        producer or experiment, alone or per catalyst mass or area (µmol, µmol/g). An amount is not a rate, and amounts
        over two intervals are two results.
      dimensions: [amount, mass, volume, amount_per_mass, amount_per_area]
      compare_by:
      - species
      - context: flow_reference
        when_dimension: [volume]
      denominator:
        description: The catalyst mass or the electrode or illuminated area the amount is divided by.
        dimensions: [mass, area]
      maturity: provisional
    balance:
      description: A closure, what a balance finds of an element or of charge in what it counts (the products, and the
        unconverted reactant when it is included) divided by what went in (fed, converted or passed), over the
        streams, phases and interval its producer includes; dimensionless. It is kept as reported, above 100 % too, as
        a measured closure whose uncertainty may include 100 %, never capped or forced to close. What a balance leaves
        unmeasured is recorded as such (unresolved_target), never computed.
      dimensions: [dimensionless]
      compare_by: [balance_basis]
      closure: true
      maturity: provisional
    composition_fraction:
      description: The share of a component in a sample, a catalyst, a mixture or a phase (mass, mole, atom or volume
        fraction), dimensionless; an amount, a concentration or a loading is a quantity of its own.
      dimensions: [dimensionless]
      compare_by: [fraction_basis]
      share: true
    loading:
      description: The amount of an active component on its support or electrode, as a share (wt%), per mass of
        support (mmol/g) or per area (mg/cm2).
      dimensions: [dimensionless, amount_per_mass, mass_per_area, amount_per_area]
      compare_by:
      - context: fraction_basis
        when_dimension: [dimensionless]
    concentration:
      description: The amount (mol/L) or mass (g/L) of a component per volume of its mixture, or its amount per mass of
        solvent (molality, mol/kg), kept apart by its unit.
      dimensions: [amount_concentration, mass_concentration, amount_per_mass]
    flow_rate:
      description: A volumetric, molar or mass flow rate; a volumetric flow is comparable only at one stated reference
        condition.
      dimensions: [volumetric_flow, molar_flow, mass_flow]
      compare_by:
      - context: flow_reference
        when_dimension: [volumetric_flow]
    space_velocity:
      description: A feed flow divided by the amount of catalyst (IUPAC space velocity); what is divided by what, and
        at which conditions a gas volume is counted, decide the quantity.
      dimensions: [frequency, volume_per_mass_time]
      compare_by:
      - space_velocity_basis
      - context: flow_reference
        when:
          space_velocity_basis: [ghsv, volume_per_catalyst_mass]
      denominator:
        description: The catalyst bed volume or catalyst mass the flow is divided by.
        dimensions: [volume, mass]
    faradaic_efficiency:
      description: The share of the charge passed that forms one product (its target), dimensionless.
      dimensions: [dimensionless]
      compare_by: [species]
      share: true
    quantum_yield:
      description: Events (product formed, reactant consumed) per photon absorbed, for one product (IUPAC quantum yield);
        it can exceed one in a chain reaction.
      dimensions: [dimensionless]
      compare_by: [species]
    photonic_yield:
      description: Events per photon incident on the system, for one product (IUPAC photonic yield; what many sources
        call an apparent quantum yield); a lower bound of the quantum yield.
      dimensions: [dimensionless]
      compare_by: [species]
    energy_yield:
      description: Amount or mass of one product per energy supplied (g/kWh, mol/kJ).
      dimensions: [amount_per_energy, mass_per_energy]
      compare_by: [species]
    efficiency:
      description: A dimensionless efficiency of energy or charge conversion (IPCE, ABPE, plasma energy efficiency).
      dimensions: [dimensionless]
      share: true
    site_fraction:
      description: The share of a stated whole that a population of sites makes up (of the exposed atoms of an element, of
        all its atoms, of the sites of a kind), dimensionless; the value's basis names the whole and is compared as text.
        A share is not a count of sites, so no rate is divided by it.
      dimensions: [dimensionless]
      share: true
      maturity: provisional
    site_density:
      description: The sites of a population per surface area or per mass of the material or catalyst they belong to
        (µmol/m2, sites/nm2, µmol/g), counted or estimated by a stated method.
      dimensions: [amount_per_area, number_per_area, amount_per_mass, number_per_mass]
      maturity: provisional
    site_count:
      description: A number of sites, or of exposed atoms taken as sites, absolute (µmol, a number of sites) or per mass
        of catalyst (µmol/g), counted, estimated or assumed by a stated method; never a share (site_fraction).
      dimensions: [amount, dimensionless, amount_per_mass, number_per_mass]
      maturity: provisional
    turnover_frequency:
      description: Events (one product formed or one reactant converted, its target) per site per time, as reported. How
        it was calculated is recorded with it, never inferred, in the count of sites it is divided by (normalized_by, a
        value that keeps its own method, origin and assumptions) and, in its basis or definition, in what was counted as
        sites (the exposed atoms, the sites of one kind, every atom) and how. Rates of two species are never compared with one
        another; rates calculated on different counts are compared as reported, each with its denominator.
      dimensions: [frequency]
      compare_by: [species]
      denominator:
        description: The count of sites the rate is divided by (sites counted by chemisorption, titration or a model),
          absolute or per catalyst mass, or a density of sites per area for a rate per area; a site count or a site
          density, never a share.
        dimensions: [dimensionless, amount, amount_per_mass, number_per_mass, amount_per_area, number_per_area]
        kinds: [site_count, site_density]
        unstated: warning
    electronic_energy:
      description: The total electronic energy of one structure model, as an electronic-structure calculation reports it (a
        DFT total energy). Its zero depends on the method, the code and its pseudopotentials or basis set, so totals are
        compared only for one structure (its target, or the model that holds it) under one level of theory; a difference
        of totals, such as an adsorption energy, is a reaction energy.
      dimensions: [energy]
      compare_by: [structure, level_of_theory, charge_treatment]
      shows: [dispersion, hubbard_u, spin_treatment, solvation]
      maturity: provisional
    reaction_energy:
      description: The electronic energy change of a reaction or an elementary step, products minus reactants; an
        adsorption energy is the reaction energy of an adsorption. Its target, or the step that holds it, names the
        process, whose participants are the reference states. Kept as reported, with or without zero-point energy as its
        definition says; never an enthalpy or a free energy.
      dimensions: [energy, molar_energy]
      compare_by: [process, level_of_theory, charge_treatment]
      shows: [electrode_potential, dispersion, hubbard_u, spin_treatment, solvation]
      maturity: provisional
    reaction_enthalpy:
      description: The enthalpy change of a reaction or an elementary step at the temperature its producer states,
        products minus reactants, as reported (computed with thermal corrections, or measured). It depends on the
        temperature, which a value states.
      dimensions: [energy, molar_energy]
      compare_by: [process, level_of_theory, charge_treatment]
      shows:
      - property: temperature
        warn: true
      - pressure
      - electrode_potential
      - dispersion
      - hubbard_u
      - spin_treatment
      - solvation
      maturity: provisional
    reaction_free_energy:
      description: The free energy change of a reaction or an elementary step (a Gibbs energy, or a grand-canonical one at
        constant potential), products minus reactants, at the temperature, pressures and electrode potential its producer
        states; an adsorption free energy is the reaction free energy of an adsorption. Never compared with an electronic
        energy change, even in the same unit.
      dimensions: [energy, molar_energy]
      compare_by: [process, level_of_theory, charge_treatment]
      shows:
      - property: temperature
        warn: true
      - pressure
      - electrode_potential
      - dispersion
      - hubbard_u
      - spin_treatment
      - solvation
      maturity: provisional
    activation_energy:
      description: The activation energy of one elementary step, the step that holds it or its target (its process). It is
        either the energy of the step's transition state above its initial state (a computed barrier) or the activation
        energy of its rate constant (the Ea of an Arrhenius expression in a mechanism), as its definition says. It is
        never the apparent activation energy of an overall rate (apparent_activation_energy). A mechanism file may give it
        divided by the gas constant, in kelvin; it is kept so, and compared only with values in that unit.
      dimensions: [energy, molar_energy, temperature]
      compare_by: [process, level_of_theory, charge_treatment]
      shows: [electrode_potential, dispersion, hubbard_u, spin_treatment, solvation]
      maturity: provisional
    activation_free_energy:
      description: The free energy of one elementary step's transition state above its initial state, at the temperature
        and electrode potential its producer states.
      dimensions: [energy, molar_energy]
      compare_by: [process, level_of_theory, charge_treatment]
      shows:
      - property: temperature
        warn: true
      - pressure
      - electrode_potential
      - dispersion
      - hubbard_u
      - spin_treatment
      - solvation
      maturity: provisional
    apparent_activation_energy:
      description: The activation energy of an overall rate (of forming one product or converting one reactant, its target),
        from the temperature dependence of measured or modelled rates over the range of its fit (an Arrhenius plot). It
        combines the barriers and adsorption enthalpies of the steps behind the rate, so it is not the activation energy
        of any one step; the temperature range of the fit is stated with it. A source may give it divided by the gas
        constant, in kelvin (the slope of the plot); it is kept so, and compared only with values in that unit.
      dimensions: [energy, molar_energy, temperature]
      compare_by: [species]
      shows:
      - property: temperature
        warn: true
      - pressure
      maturity: provisional
    degree_of_rate_control:
      description: How sensitive a rate (of forming one product, its target) is to the rate constant of one step, at the
        conditions and in the catalyst state of the computation that found it (dimensionless; the degree of rate control).
        It changes with the conditions, so it is shown with the temperature and pressure it holds at, and it is never a
        property of the step alone.
      dimensions: [dimensionless]
      compare_by: [species]
      shows: [temperature, pressure]
      maturity: provisional
    enzyme_activity:
      description: The catalytic activity of an enzyme or a whole-cell preparation, its target the substrate converted or
        the product formed, under the assay conditions its producer states. Per time it is an amount of substance per time
        (the enzyme unit, U, one micromole per minute, or the katal, one mole per second, with their prefixes, as mU or nkat);
        per mass of enzyme or of the preparation it is a specific activity (U/mg), per volume of a solution or a
        suspension a volumetric activity (U/mL), each kept apart by its unit. What it is divided by is named (normalized_by)
        or stated in its basis or definition. Activities toward two substrates are never compared with one another.
      dimensions: [molar_flow, amount_per_mass_time, amount_per_volume_time]
      compare_by: [species]
      denominator:
        description: The mass of enzyme or of the preparation (a specific activity) or the volume of the solution or
          suspension (a volumetric activity) the activity is divided by.
        dimensions: [mass, volume]
      shows:
      - property: temperature
        warn: true
      maturity: provisional
    michaelis_constant:
      description: The substrate concentration at which an enzyme-catalysed rate is half its limiting rate (Km), for one
        substrate, its target, as reported from a fit of rates against concentration; its producer states the
        conditions. The limiting rate per active site (kcat) is a turnover frequency.
      dimensions: [amount_concentration]
      compare_by: [species]
      maturity: provisional
    turnover_number:
      description: Events (one product formed or one reactant converted, its target) per site or per molecule of
        catalyst over a stated run, dimensionless (TON), as reported; how the catalyst or its sites were counted is
        recorded with it (its definition or basis), never inferred. Distinct from a turnover frequency, which is per
        time.
      dimensions: [dimensionless]
      compare_by: [species]
      denominator:
        description: The amount of catalyst (the molecules of a molecular catalyst) or the count of sites the events are
          divided by, a site count or an amount; never a share.
        dimensions: [dimensionless, amount]
      maturity: provisional
    transport_criterion:
      description: A dimensionless criterion computed from reported data to judge whether transport limits a measured
        rate, as a transport check reports it - Weisz-Prater for diffusion in the pores, Carberry for mass transfer to
        the particle, Anderson for heat in it, Mears for mass or heat transfer (which one, its transport_mode). Its basis
        or definition names the criterion; values of two criteria, or of two Mears criteria, are never compared with one
        another. What threshold the source applies stays with the check's verdict.
      dimensions: [dimensionless]
      compare_by:
      - transport_criterion
      - context: transport_mode
        when:
          transport_criterion: [mears]
      maturity: provisional
    effectiveness_factor:
      description: The ratio of the rate observed in a catalyst particle to the rate it would have without transport
        limitation, dimensionless, as reported or computed by a transport check (its producer). The internal factor
        compares with the rate at the particle's external surface conditions, the overall one with the rate at the bulk
        fluid conditions (external transfer included); its basis or definition says which (effectiveness_basis).
      dimensions: [dimensionless]
      compare_by: [effectiveness_basis]
      maturity: provisional
    thiele_modulus:
      description: The Thiele modulus of a catalyst particle, dimensionless, as reported or computed by a transport check.
        Its square measures the ratio of a surface reaction rate to a rate of diffusion in the particle. Its value
        depends on the length it is computed with (the particle radius, or the volume over the external surface, a
        third of it for a sphere) and on its form (first order, or generalized to another rate form), which its basis
        or definition states; moduli of two conventions are never compared with one another.
      dimensions: [dimensionless]
      compare_by: [characteristic_length, thiele_form]
      maturity: provisional
    energy_consumption:
      description: Energy supplied per amount (kJ/mol) or per mass (kWh/kg) of one product, its target, the inverse of an
        energy yield. Its basis or definition says which energy it counts (energy_input; the electrical input to a cell
        or a plasma, the heat supplied, every input) and over which boundary (system_boundary; the device, or the
        process with its separation); values of two energies or two boundaries are never compared with one another, and
        values per amount and per mass are kept apart by their unit.
      dimensions: [molar_energy, specific_energy]
      compare_by: [species, energy_input, system_boundary]
      maturity: provisional
