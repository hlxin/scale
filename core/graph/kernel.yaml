  REVISES:
    description: A new version of a graph record replaces an earlier one of the same label; the earlier
      one is kept. Acyclic. For graph records only; versions of a publication (preprint, accepted manuscript,
      version of record), its translations and duplicate publications are SAME_WORK_AS between Sources.
    from: ANY
    to: ANY
  UPDATES:
    maps_to:
    - Crossref update types (Crossmark)
    - PROV-O wasRevisionOf
    description: |
      A notice updates a published source or dataset without retracting it: a correction (erratum,
      corrigendum), an expression of concern, an addendum or clarification, a withdrawal or removal, a new
      version or edition. The notice is a Source of its own (kind correction, expression_of_concern,
      addendum, withdrawal_notice, removal_notice, or the new version itself) and the link cites it as
      evidence. A retraction is RETRACTS, not an update. The updated source's publication status is
      derived from these links and RETRACTS (withdrawal and removal count as retraction), never typed by
      hand; the records it supports are kept.
    from:
    - Source
    to:
    - Source
    - Dataset
    required:
    - update_type
    - evidence
    properties:
      update_type:
        type: enum
        values:
        - correction
        - erratum
        - corrigendum
        - expression_of_concern
        - addendum
        - clarification
        - withdrawal
        - removal
        - new_version
        - new_edition
        description: What the notice does, in Crossref's terms (correction, erratum and corrigendum correct
          errors; withdrawal and removal take the source out of the record; new_version and new_edition
          supersede it).
      updated_on:
        type: date
        description: When the notice was issued, at the precision known.
      reason:
        type: text
        description: The reason the notice gives, in a short paraphrase or quote.
    maturity: provisional
  SAME_WORK_AS:
    maps_to:
    - Crossref relation types (preprint, manuscript, version, translation, identical)
    - DataCite relationType IsVersionOf, IsTranslationOf, IsIdenticalTo
    description: |
      Two sources report the same work: the source is the preprint, the accepted manuscript or another
      version of the target, a translation of it, or a duplicate publication. What both report is one
      finding, not a replication; the evidence cites the version that was read (its text_version).
      Versions of a publication are linked here; REVISES is for versions of graph records.
    from:
    - Source
    to:
    - Source
    required:
    - relation
    properties:
      relation:
        type: enum
        values:
        - preprint_of
        - accepted_manuscript_of
        - version_of
        - translation_of
        - duplicate_of
        description: How the source relates to the target (source relation target).
    maturity: provisional
rules:
- A TESTS link whose outcome is supports, disputes or refutes carries evidence or result_refs.
- A Prediction tested by an experiment that started before the prediction's proposed_at is flagged post
  hoc (only when both dates are known).
- A TESTS supports outcome that rests on a fitted value is flagged (a fit does not confirm its own data).
- A validation or benchmark (EVALUATES) of a model is flagged (advisory) when its experiment uses data the model was
  fitted to (what an experiment that calibrates the model, or outputs it, HAS_INPUT as training_data or calibration_data,
  and the records a dataset among them INCLUDES), or when its passing outcome rests on a fitted value; a fit to its own
  data is a calibration, never independent predictive validation.
- A predicted value that does not sit on the experiment that predicted it names that experiment (produced_by)
  (advisory).
- A Hypothesis with hypothesis_status supported needs a supports outcome or a SUPPORTS link; refuted needs
  a refutes outcome or a CONTRADICTS link; disputed needs a disputes or refutes outcome or a CONTRADICTS
  link.
- An Experiment with approach hypothesis_driven TESTS or AIMS_TO_TEST a hypothesis or prediction (advisory).
- A Prediction has a statement or an expected value; its variable and expected.variable agree.
- A quantitative Variable has a quantity_kind; a value of a nominal or ordinal variable is a text_value,
  one of its categories.
- A value bound to a quantity contract (its property's quantity, or its Variable's quantity_kind) is in a unit of
  its kind's dimensions (an error otherwise; a unit the vocabulary cannot read is reported, not checked); the
  contexts it is compared by, read from the value and its record, agree unless the value is an evidenced conversion
  (advisory); a share above 100 % or below zero is flagged (advisory). Nothing is converted.
- CONTROL_FOR names at least one variable in differs_in (advisory). No confounding verdict is drawn from
  the count.
- REPLICATES with level reproduce lists what changed (advisory).
- A dynamic Operation names its varied_quantities and says how they vary (segments, period or frequency);
  a static one has time_pattern constant (or none).
- PART_OF, PRECEDES, HAS_PART and REVISES are acyclic; no kernel edge joins a record to itself; REVISES
  joins records of the same label.
- A record_ref resolves to a node or link, and its path to a property of it; evidence_ids name evidence
  of the owning record. A record_ref into result_values names the entry by its id, never by its position.
- An entry of result_values names its variable and has an id; one that states a number or a text names the evidence
  that states it (evidence_ids); one of a kind counted for a species names its target or says the product is not
  identified (unresolved_target). Two entries of one record that nothing tells apart (one variable, target, producer,
  phase, stream, basis, definition and normalization) are flagged as an ambiguous repetition (advisory), never
  averaged.
- A balance (a quantity kind that closes, quantities.kinds closure) above 100 % is kept as reported and flagged
  (advisory), saying whether 100 % lies within its stated uncertainty.
- An experiment that used an input at input_version lower than the input's current record_version is flagged
  inputs_revised (advisory).
- A RETRACTS link from a notice Source is authoritative. A source's publication status is derived from
  the RETRACTS and UPDATES links that reach it (retracted; withdrawn for a withdrawal or removal; partially
  retracted; expression of concern; corrected; updated; otherwise current or unknown), never typed by
  hand; status_check records only that someone looked.
- A retracted (or withdrawn) source does not make its claims false. Tools flag the records whose evidence
  rests on retracted sources (one hop along HAS_INPUT and produced_by; records a retracted dataset includes
  count too) and leave them out of query answers by default (include_retracted keeps them, labelled);
  they never rewrite or delete a record.
- UPDATES cites its notice as evidence; RETRACTS states retracted_on (advisory); scope_locators go only
  with scope partial.
- A claim_status or hypothesis_status retracted is backed by a RETRACTS link to the record or by a retracted
  source (advisory); a supported claim resting only on retracted sources is flagged (advisory).
status_check:
  maturity: provisional
  description: |
    That someone looked for notices about a source or dataset (a retraction, a withdrawal, an
    expression of concern, a correction), when and how. Record it only when a person or a tool actually
    checked; never fill it in as a default. Absent means never checked. It does not set the
    publication status, which follows from the notice links that reach the source (RETRACTS, UPDATES):
    a check that found a notice is followed by recording that notice as a Source with its link.
  required:
  - checked_on
  - checked_via
  - result
  fields:
    checked_on:
      type: date
      description: When the check was made, at the precision known.
    checked_via:
      type: text
      description: Where and how (the publisher's article page, a registry's update metadata of a given
        date, a retraction database, a library service), and by whom when it matters.
    result:
      type: enum
      values:
      - no_notice_found
      - notice_found
      description: no_notice_found = nothing was found on that date by that means (not a proof that none
        exists); notice_found = a notice was found, and is recorded as a Source that RETRACTS or UPDATES
        this one.
  rules:
  - status_check is recorded only for a check that was made; its absence means never checked.
  - It never sets a publication status; the status follows from the notice links.
quantities:
  maturity: provisional
  description: |
    Quantity contracts: the kind of quantity a value property holds, the units that can state it, what a
    normalized quantity is divided by (its denominator) and the context without which two of its values are not
    comparable. A property names its contract with `quantity:` and, with `context:`, the sibling property of its
    record that states a context; a value names one through its Variable's quantity_kind. Quantities of one kind
    share a dimension, but one dimension does not make one kind (VIM 1.2, 1.7): an electrode potential and a cell
    voltage are both in volts, a GHSV and a WHSV both in reciprocal hours, so a kind also says which context
    (`compare_by`) two values must share. The validator reads a value's unit for its dimension and never converts
    it: a unit of another dimension is an error, a unit it cannot read is reported and not checked. A context is
    read from what the value states (its unit, basis, definition, target or normalized_by) and from the sibling
    property; disagreeing statements are reported, except that a value derived from the record's own (origin
    derived or computed, with produced_by: an evidenced conversion) keeps its own. A context may also be read from the
    record that holds the value (an elementary step's activation energy is of that step) or from the experiment that
    produced it (a computed energy's level of theory and charge treatment); a context that compares the values that do
    not state it apart from the others (`unstated: group`) never leaves one out. A kind may show what the value's
    producer states of other properties (`shows`: a free energy's temperature, a calculation's dispersion correction),
    which a comparison shows in each row and never groups by. `scale graph query` with `comparison: scientific` compares
    and ranks values of a kind only with values of that kind, in one unit and one context (docs/querying.md); without
    it, values are compared as reported, as before. A domain says which records a context
    read from a target may name (context_targets: in catalysis, a species is a ChemicalSpecies). A kind that closes
    (closure: a balance) is kept as reported above 100 % and flagged with what its uncertainty says.
  basis:
  - JCGM 200:2012, International vocabulary of metrology (VIM), doi:10.59161/JCGM200-2012 (kind of quantity, quantity dimension, measurement unit, measurand).
  - JCGM 100:2008, Guide to the expression of uncertainty in measurement (GUM), doi:10.59161/JCGM100-2008E (an uncertainty is kept as reported; none is propagated).
  - IUPAC Gold Book, mean current density, doi:10.1351/goldbook.M03776 (a current divided by the area of the electrode it flows through).
  - IUPAC Gold Book, quantum yield, doi:10.1351/goldbook.Q04991 (events per photon absorbed).
  - IUPAC Gold Book, photonic yield, doi:10.1351/goldbook.14058 (events per photon incident).
  - IUPAC Gold Book, space velocity, doi:10.1351/goldbook.S05779 (the feed's volumetric flow at stated conditions divided by the catalyst volume).
  - Clark et al., Standards and protocols for data acquisition and reporting for studies of the electrochemical reduction of carbon dioxide, ACS Catal. 2018, 8, 6560, doi:10.1021/acscatal.8b01340 (Faradaic efficiency, the share of the charge that makes a given product; it and that product's rate, its partial current density, say different things; rates normalized by the geometric and by the electrochemically active area).
  - Kearnes et al., The Open Reaction Database, J. Am. Chem. Soc. 2021, 143, 18820, doi:10.1021/jacs.1c09820 (each measurement of a product names its type (identity, yield, selectivity, amount), the analysis it comes from and any standard used; the conversion and the reaction time belong to the outcome).
  - Bonchio et al., Best practices for experiments and reporting in photocatalytic CO2 reduction, Nat. Catal. 2023, 6, 657, doi:10.1038/s41929-023-00992-7 (gas and liquid products identified and quantified by their own analyses, each calibrated; control experiments; detection limits; selectivity as one product's amount over all products'; uncertainties from repeated measurements).
  - Winther et al., Catalysis-Hub.org, an open electronic structure database for surface reactions, Sci. Data 2019, 6, 75, doi:10.1038/s41597-019-0081-y (an adsorption energy is the energy of a reaction with gas-phase references, H2O(g) - H2(g) + * -> O*; reaction energies from different DFT codes and exchange-correlation functionals are not necessarily directly comparable, so the code and the functional are tracked with every energy; lattice constants, sites, layers, cutoff, k-points and U-values also affect the energetics; the structures are stored with the energies).
  - Mamun et al., High-throughput calculations of catalytic properties of bimetallic alloy surfaces, Sci. Data 2019, 6, 76, doi:10.1038/s41597-019-0080-z (an adsorption energy is E(slab+adsorbate) - E(slab) - the gas-phase references, chosen among CH4, H2, N2, H2O and H2S).
  - Melander, Wu, Weckman and Honkala, Constant inner potential DFT for modelling electrochemical systems under constant potential and bias, npj Comput. Mater. 2024, 10, 5, doi:10.1038/s41524-023-01184-4 (constant-charge, canonical, and constant-potential, grand-canonical, calculations; grand free energies are a Legendre transform of canonical ones, and the two ensembles are equivalent only under stated conditions; at least four definitions of a single electrode potential, with different scales and references).
  - Allam et al., AQCat25, unlocking spin-aware, high-fidelity machine learning potentials for heterogeneous catalysis, npj Comput. Mater. 2026, 12, 226, doi:10.1038/s41524-026-02099-6 (spin-polarized and unpolarized calculations, and calculations of different fidelity, give different energies, by up to about 1 eV for an adsorbate on a magnetic surface; adsorbate references CO, H2, H2O and N2; models evaluated on validation and test splits not seen in training).
  - Cantera 3.2 documentation, Reactions and General Structure (Units), cantera.org/stable/yaml (a reaction equation names each participant with its stoichiometric coefficient; Ea is a parameter of a rate expression, given in an energy, an energy per quantity or K; a reaction is checked to balance in elements, and on surfaces in sites).
  - Behr, Borgelt and Kockmann, Ontologies4Cat, investigating the landscape of ontologies for catalysis research data management, J. Cheminform. 2024, 16, 16, doi:10.1186/s13321-024-00807-2 (no ontology of their collection contains heterogeneous or homogeneous catalysis, synthesis data, or heat, transport and kinetic data; one contains biocatalysis, one process design, energy and cost data).
  - Systems Biology Ontology, enzyme activity (SBO:0000559, an amount converted per time under specified conditions, often micromoles per minute, the enzyme unit), specific activity (SBO:0000558, per mass of enzyme), Michaelis constant (SBO:0000027) and catalytic rate constant (SBO:0000025, kcat).
  - Fogler, Elements of Chemical Reaction Engineering, 4th ed., Pearson, 2006, chapter 12 (the square of the Thiele modulus, with the particle radius, a measure of the ratio of a surface reaction rate to a rate of diffusion in the pellet; the internal and the overall effectiveness factor; Mears' criterion for external diffusion and his criterion for heat transfer between the fluid and the pellet, two formulas, each below 0.15; the Weisz-Prater criterion for internal diffusion).
  - Mears, Tests for transport limitations in experimental catalytic reactors, Ind. Eng. Chem. Process Des. Dev. 1971, 10, 541, doi:10.1021/i260040a020, and Diagnostic criteria for heat transport limitations in fixed bed reactors, J. Catal. 1971, 20, 127, doi:10.1016/0021-9517(71)90073-X (criteria for mass and for heat transport, the second for heat in a fixed bed).
  - Aris, On shape factors for irregular particles - I, Chem. Eng. Sci. 1957, 6, 262, doi:10.1016/0009-2509(57)85028-3, and Bischoff, Effectiveness factors for general reaction rate forms, AIChE J. 1965, 11, 351, doi:10.1002/aic.690110229 (a Thiele modulus with the particle volume over its external surface as length, and one generalized to any rate form).
